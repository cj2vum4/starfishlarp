<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天才在左 我在右｜玩家端</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #080810;
    --surface: #10101e;
    --surface2: #18182a;
    --accent: #c8a97e;
    --accent2: #e8c49e;
    --red: #e05555;
    --green: #55c48a;
    --blue: #5599e0;
    --purple: #9055e0;
    --text: #e8e0d0;
    --muted: #6a6a8a;
    --border: #202038;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif TC', '思源宋體', Georgia, serif;
    min-height: 100vh;
  }

  /* ---- SESSION + INTRO SCREEN ---- */
  #sessionScreen, #introScreen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at center, #1a1030 0%, #080810 70%);
  }
  .intro-title {
    font-size: 1.6rem;
    color: var(--accent);
    text-align: center;
    letter-spacing: 0.15em;
    margin-bottom: 6px;
  }
  .intro-sub {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    margin-bottom: 32px;
    letter-spacing: 0.08em;
  }
  .char-select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 24px;
  }
  .char-select-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .char-select-card:hover, .char-select-card.selected {
    border-color: var(--accent);
    background: var(--surface2);
  }
  .char-select-card.selected { box-shadow: 0 0 16px rgba(200,169,126,0.3); }
  .csc-num {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    font-weight: bold;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 8px;
  }
  .csc-name { font-size: 1rem; color: var(--text); }
  .csc-desc { font-size: 0.72rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .name-input {
    width: 100%;
    max-width: 320px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    text-align: center;
    margin-bottom: 16px;
  }
  .name-input:focus { outline: none; border-color: var(--accent); }
  .enter-btn {
    padding: 12px 36px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: all 0.2s;
  }
  .enter-btn:hover { background: var(--accent2); }
  .enter-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---- MAIN APP ---- */
  #appScreen { display: none; }
  .app-header {
    background: linear-gradient(135deg, #08080f 0%, #141028 100%);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .app-header-left { display: flex; align-items: center; gap: 12px; }
  .my-char-badge {
    background: var(--accent);
    color: #000;
    font-size: 0.8rem;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }
  .app-title { font-size: 1rem; color: var(--accent); letter-spacing: 0.08em; }
  .phase-indicator {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: right;
    line-height: 1.4;
  }
  /* TABS */
  .ptabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ptabs::-webkit-scrollbar { display: none; }
  .ptab-btn {
    padding: 12px 18px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.88rem;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .ptab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--surface2); }

  /* CONTENT */
  .pcontent { padding: 20px; max-width: 700px; margin: 0 auto; }
  .ptab-panel { display: none; }
  .ptab-panel.active { display: block; }

  /* CARD */
  .pcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .pcard-title {
    font-size: 0.95rem;
    color: var(--accent);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.08em;
  }
  /* CLUE INPUT */
  .clue-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .clue-code-input {
    flex: 1;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 0.95rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .clue-code-input:focus { outline: none; border-color: var(--accent); }
  .clue-submit-btn {
    padding: 10px 20px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .clue-submit-btn:hover { background: var(--accent2); }

  /* UNLOCKED CLUE */
  .clue-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .clue-item-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .clue-item-name { font-size: 0.9rem; color: var(--accent2); }
  .clue-item-code {
    font-family: monospace;
    font-size: 0.72rem;
    color: var(--muted);
    background: var(--surface);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .clue-item-body {
    font-size: 0.88rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }
  /* ERROR */
  .error-msg {
    color: var(--red);
    font-size: 0.82rem;
    margin-top: 6px;
    min-height: 18px;
  }
  /* CHARACTER INFO */
  .char-info-name {
    font-size: 1.4rem;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 0.1em;
  }
  .char-info-tag {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.78rem;
    padding: 3px 10px;
    border-radius: 12px;
    margin: 3px 3px 3px 0;
  }
  .char-info-desc {
    margin-top: 14px;
    font-size: 0.9rem;
    line-height: 1.9;
    color: var(--text);
    background: var(--surface2);
    border-left: 2px solid var(--accent);
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
  }
  /* NOTICE */
  .notice {
    background: #1a1a08;
    border: 1px solid #4a4a18;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.85rem;
    line-height: 1.7;
    color: #d0c870;
    margin-bottom: 14px;
  }
  /* BROADCAST */
  .broadcast-item {
    background: var(--surface2);
    border-left: 2px solid var(--accent);
    padding: 10px 14px;
    margin-bottom: 8px;
    border-radius: 0 6px 6px 0;
    font-size: 0.88rem;
    line-height: 1.6;
    animation: fadeIn 0.3s ease;
  }
  .broadcast-time { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
  .no-broadcast { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 20px; }
  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.85rem;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    z-index: 999;
    max-width: 280px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--red); color: var(--red); }
  /* SCRIPT READER */
  .act-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .act-nav-btn {
    padding: 5px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .act-nav-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .act-nav-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .script-act-title {
    font-size: 1rem;
    color: var(--accent2);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.08em;
  }
  .script-body {
    font-size: 0.88rem;
    line-height: 2;
    color: var(--text);
  }
  .act-nav-inline {
    padding: 7px 16px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--accent);
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .act-nav-inline:hover { background: var(--accent); color: #000; border-color: var(--accent); }
  /* TIMELINE */
  .mini-tl { font-size: 0.82rem; }
  .mtl-item {
    display: flex;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    line-height: 1.6;
  }
  .mtl-date { min-width: 80px; color: var(--accent); font-size: 0.78rem; padding-top: 2px; }
  .mtl-desc { flex: 1; color: var(--text); }
  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 2rem; margin-bottom: 8px; }
  .empty-state p { font-size: 0.85rem; line-height: 1.6; }
  .act-nav-inline-dup {
    display: none; /* duplicate removed */
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .act-nav-inline:hover { background: var(--accent); color: #000; border-color: var(--accent); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- SESSION JOIN SCREEN -->
<div id="sessionScreen" style="display:none">
  <div class="intro-title">⚖️ 天才在左，我在右</div>
  <div class="intro-sub">輸入主持人提供的場次代碼</div>
  <input class="name-input" id="sessionCodeInput" placeholder="場次代碼（例如：TC-AB12）" maxlength="20"
    style="text-align:center;letter-spacing:0.15em;font-size:1.1rem;text-transform:uppercase"
    oninput="this.value=this.value.toUpperCase()" />
  <button class="enter-btn" onclick="joinSession()" style="margin-top:12px">加入場次</button>
  <div id="sessionError" style="color:#e05555;font-size:0.82rem;margin-top:10px;text-align:center"></div>
</div>

<!-- INTRO SCREEN -->
<div id="introScreen" style="display:none">
  <div class="intro-title">⚖️ 天才在左，我在右</div>
  <div class="intro-sub" id="introSessionBadge">劇本殺玩家端 — 選擇你的角色</div>
  <div class="char-select-grid" id="charSelectGrid"></div>
  <input class="name-input" id="playerNameInput" placeholder="輸入你的名字（暱稱）" />
  <button class="enter-btn" id="enterBtn" onclick="enterGame()" disabled>進入遊戲</button>
</div>

<!-- MAIN APP -->
<div id="appScreen" style="display:none">
  <div class="app-header">
    <div class="app-header-left">
      <span class="my-char-badge" id="myCharBadge"></span>
      <span class="app-title">天才在左，我在右</span>
    </div>
    <div class="phase-indicator" id="phaseIndicator">等待主持人開場</div>
  </div>
  <div class="ptabs">
    <button class="ptab-btn active" onclick="switchPTab('story')">📖 我的劇本</button>
    <button class="ptab-btn" onclick="switchPTab('clues')">🔍 線索解鎖</button>
    <button class="ptab-btn" onclick="switchPTab('broadcast')">📢 主持人通知</button>
    <button class="ptab-btn" onclick="switchPTab('timeline')">📅 案件時間軸</button>
    <button class="ptab-btn" id="book2Tab" style="display:none" onclick="switchPTab('book2')">📕 第二本劇本</button>
  </div>
  <div class="pcontent">

    <!-- MY STORY -->
    <div class="ptab-panel active" id="ptab-story">
      <div class="pcard">
        <div class="pcard-title">🎭 我的角色</div>
        <div id="myCharInfo"></div>
      </div>
      <div class="pcard" id="questGuide">
        <div class="pcard-title">📋 你的問卷提示</div>
        <div id="questGuideContent"></div>
      </div>
    </div>

    <!-- CLUES -->
    <div class="ptab-panel" id="ptab-clues">
      <div class="pcard">
        <div class="pcard-title">🔍 輸入線索代碼</div>
        <div class="notice">
          📌 主持人會在每個場景發放線索代碼。輸入代碼後即可查看對應線索內容。<br>
          代碼不分大小寫，例如：<code style="color:var(--green)">V2-BM01</code>
        </div>
        <div class="clue-input-row">
          <input class="clue-code-input" id="codeInput" placeholder="輸入代碼..." maxlength="20"
            onkeydown="if(event.key==='Enter')unlockClue()" />
          <button class="clue-submit-btn" onclick="unlockClue()">解鎖</button>
        </div>
        <div class="error-msg" id="codeError"></div>
      </div>
      <div id="unlockedClues"></div>
    </div>

    <!-- BROADCAST -->
    <div class="ptab-panel" id="ptab-broadcast">
      <div class="pcard">
        <div class="pcard-title">📢 主持人通知</div>
        <div id="broadcastList"></div>
      </div>
    </div>

    <!-- BOOK 2 -->
    <div class="ptab-panel" id="ptab-book2">
      <div class="pcard">
        <div class="pcard-title">📕 第二本劇本</div>
        <div class="act-nav" id="book2Nav"></div>
        <div id="book2Content"></div>
      </div>
    </div>

    <!-- TIMELINE -->
    <div class="ptab-panel" id="ptab-timeline">
      <div class="pcard">
        <div class="pcard-title">📅 公開時間軸</div>
        <p style="font-size:0.78rem;color:var(--muted);margin-bottom:12px">以下為主持人公開的案件背景，更多細節需透過線索解鎖。</p>
        <div class="mini-tl">
          <div class="mtl-item"><div class="mtl-date">2014.07.10</div><div class="mtl-desc">第一起命案發生</div></div>
          <div class="mtl-item"><div class="mtl-date">2014.07.11</div><div class="mtl-desc">第二起命案發生</div></div>
          <div class="mtl-item"><div class="mtl-date">2014.07.12</div><div class="mtl-desc">第三起命案發生</div></div>
          <div class="mtl-item"><div class="mtl-date">2014.07.21</div><div class="mtl-desc">葬禮儀式（今天）</div></div>
          <div class="mtl-item"><div class="mtl-date">現在</div><div class="mtl-desc">你收到邀請，來到了這裡……</div></div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// DATA
// ============================================================
// ============================================================
// BOOK 2 DATA
// ============================================================
const BOOK2_LETTERS = {
  '01': `寄給沈先生：

沈先生，您好。

我是一名八卦記者。我的起步，靠的便是您給我的消息。那些獨家爆料讓我一路走到了今天的位置。

但我有一件心事，一直壓在我心底——

我的父母是普通工薪族，省吃儉用了一輩子。三年前，他們在網上買了一款保健品，被人騙了幾十萬。那些錢，是他們一生的積蓄。騙局被揭穿後，他們沒能承受那份打擊……他們選擇了自盡。

事後我查了很久，那個騙子換了身份，繼續行騙，從未受到任何懲罰。

沈先生，我希望能夠通過您的關係，幫我找到那個害死我父母的王八蛋。

我要殺了他。`,

  '02': `寄給沈先生：

沈先生，您好。

我曾是一名在讀大學生。三年前，我的室友在一家酒吧遭到侵害。我陪她去報案，也作了證，幫她找律師，替她出頭。

但事情的走向完全超出我的預料。

一個匿名博主在網上大肆發文，說我的室友是妓女，說我是共謀，說我們是為了勒索才報警。帖子轉發了幾十萬次。

我父親看到那些帖子，活活氣死了。我母親被鄰居知道後，遭人毆打。

我做了整容手術，換了一張新臉，重新開始了生活。

但我找不到那個博主。

沈先生，我希望能找到那個曾經在網上發表不實言論的人。

我想，我已經推開了這一扇殺人之門。`,

  '03': `寄給沈先生：

沈先生，您好。

我曾坐過三年冤獄。

入獄的理由是強姦，但那件事從頭到尾都不是我做的。有人故意陷害我，有人作了假口供指認我。我在牢裡待了三年，出來的時候，我媽已經不在了——她沒能撐過那三年的羞辱。

出獄後，我做了一名快遞員。我用業餘時間，把那些我認為不該活著的人，一個一個送走了。

三年前，您公寓爆炸事件發生那天，我正好去您那邊送貨。我注意到了一個細節——一個人，在您家附近鬼鬼祟祟。

沈先生，那個給我作了假口供、害死我媽的人，我一直沒找到。

我希望您幫我找到他。`,

  '04': `寄給沈先生：

沈先生，您好。

我是一名律師。

我這一生都戴著面具活著——微笑、克制、無懈可擊。在法庭上，我為有錢人辯護，有時候是明知他們有罪的情況下。

有一件事我從未對任何人說過：三年前，我代理了一宗房產詐騙案。我贏了，但我知道我的委託人是真的騙了人。那個被害人，後來跳樓了。

我沒辦法繼續假裝什麼都沒發生。

沈先生，我的願望不是復仇。我只想找一個地方，一個不需要偽裝的地方。

如果世界上有那樣一個地方，我願意用一切去換。`,

  '05': `寄給沈先生：

沈先生，您好。

我曾是一名網紅主播，靠您給我的資源一路走紅。

但三年前發生了一件事，讓一切歸零。

我的隔壁住著一個律師，他家的保姆和他有染。那天晚上，他們吵架，不知怎麼起了火。我的房間被殃及，我被燒傷了大半張臉。

警察最後只抓了保姆，說是保姆蓄意縱火。那個律師毫髮無傷，繼續做他的人上人。

沈先生，請幫我找到他。

我要親手毀了他。`,

  '06': `寄給沈先生：

const INTRO_LETTERS = {
  '01': `写给沈先生的一封信\n\n信件邮寄时间：2014年7月17日。\n信件邮寄方式：晋州市同城邮寄。\n收信人：沈先生\n寄信人：追随您的"XXX"。\n\n我最最喜欢的朋友——沈先生。\n你好。\n\n很感谢你一年前送给我的那张卡牌，每一封信件我都有这样说，你别介意，因为它真的太适合我了，我想不到世界上还有比我更符合那张卡牌的人。\n\n你给了我希望，更是我在这世间唯一活着的朋友，你知道的，那些活着的人都不愿意和我做朋友，他们觉得我是无法沟通的怪胎。\n\n除了你之外，唯一能陪伴我的就是小奥了，这么多年小奥都没有变，他依旧是我最喜欢的。我总是希望他能够展现出最好的姿态，能够帅气无比，哪怕他全身上下被我折断了上百次，我依旧觉得他是可以做到的，因为他是最棒的，对不对？\n\n我每天都在训练他，可那些坏人还是会时不时闯进我的房间，打扰我和小奥的生活，我知道他们给我食物就是为了有一天能够抢走我的小奥，所以我每一次都将他们赶跑了，可我的力量很弱，小奥什么时候才能长大保护我呢？\n\n沈先生，你记得我每天都给小奥唱的那首歌吗？\n\n"月光光，星星亮。"\n"小奥陪我住花房。"\n"你要长大保护我。"\n\n不要再受伤……\n\n十九年，我从来没有和别人说过话，每天都会给小奥唱这首歌，可...可小奥死了...就在前几天，那些坏人再次冲进我的房间，将我的小奥打倒了，它被那些坏人残忍地分尸，我想要跟他们战斗，可我却没有办法打倒那些坏人……我只能默默地唱着歌，不停地唱着，陪我的小奥说话，希望他能够活过来……\n\n是我的错！都是我的错！我没有让小奥长大，他保护不了我，我也保护不了他。\n\n我决定去陪他……\n\n红色的液体从我的手腕汩汩流出，我最后一次给小奥唱歌……\n\n可是我失败了，坏人们不让我去陪小奥。\n\n沈先生，我知道你是无所不能的，所以我偷偷写下这封信，交给你。\n\n求求你，你能让小奥复活吗？\n或者...让我去陪小奥也好啊。\n你可以实现我的愿望吗？`,

  '02': `写给沈先生的一封信\n\n信件邮寄时间：2014年7月17日。\n信件邮寄方式：晋州市同城邮寄。\n收信人：沈先生\n寄信人：追随您的"XXX"。\n\n我最亲爱的朋友——沈先生。\n你好，已许久未给你写信。\n\n我相信你会理解的，写信对我而言是一件无比艰难的事，那些痛苦和难过在心中封存，与世界格格不入，付诸纸笔更是难上加难。\n\n你曾推荐我去过很多地方，那些景色，那些花草树木，我见过阳光透过树梢落在我的脸庞，我感受过海风吹来咸咸的气息，还有那初日、落日，那些大山、河流……真的好美啊，这个世界是这么美好，可当我想要抓住的时候，它们就像一缕烟般消散了，从我的指缝溜走了。\n\n随之而来的，是令人窒息的，压抑的黑暗，那些美好的感觉越强烈，紧随其后的痛苦便越恐怖，让我撕心裂肺。\n\n我听到元数的鬼哭狼嚎，在我的耳畔喊叫着："去死吧！去死吧！你在这世上毫无用处，只会成为他人的拖累。"\n\n我看到无数的目光在夜里盯着我，我紧紧缩在被子里，他们就在角落里，黑暗里，露出凶狠的目光，随时想要将我拉入地狱！\n\n我好痛苦...好疲惫...好难过……\n\n每当我闭上眼睛，我的呼吸变得急促，那些痛苦不堪的回忆在脑海中钻来钻去，周围的一切变得恍惚，我仿佛能听到心脏破碎的声音……我不止一次想拿起刀，结束这一切！当我睁开眼想要挣扎时，身上又好似有无数的虫子在爬，撕咬我的皮肤，我都没有任何办法对抗他们，我只能伤害自己。我的身体渐渐失去活力，坐立难安，我甚至不确定自己是活着的。\n\n沈先生，当年你将卡牌交给我的时候，说过，如果我有愿望可以寻求你的帮助。你能够让我解脱吗？让我不再痛苦……我不知道还能否坚持到你回信的那一刻...尽快...请尽快……`,

  '03': `写给沈先生的一封信\n\n信件邮寄时间：2014年7月17日。\n信件邮寄方式：晋州市同城邮寄。\n收信人：沈先生\n寄信人：追随您的"XXX"。\n\n我最亲爱的朋友——沈先生\n很长时间没有给你写信了，作为一名优秀的大学生，我需要学习和参加社团活动，忙碌使我很少有时间能够坐下来安静的写一封信，我相信你一定能够理解的。\n\n我每天都在学习其他人的生活习性，学他们笑，学他们谈恋爱，学他们去沟通交流，虽然我的心是无感的，但为了和他们一样生活，我必须要去学习。\n\n相信你也是一样的，对吗？\n\n当初你将卡牌交到我手里的时候，你说过我们是同类，我一直相信，这世界上也许只有你能够理解我了。\n\n说实在的，到如今我也无法理解他们的感情，我认为感情是人类繁衍至今的枷锁，会影响判断，影响意识，为什么他们不去舍弃这种繁谯呢？\n\n我不知道，但和他们在一起真的有趣，我看着他们哭，看着他们笑，像在看一个又一个的小丑，或者说一只又一只的动物，一群低等生物。\n\n但我隐藏的很好，他们都认为我是一个谦卑恭敬的人，学习成绩第一名，获得奖学金，还有所有人的喜爱。\n\n可我每天都在想，如果他们死在我的手里，是什么画面，每当想到这里我就会特别的激动，血脉喷张，想想就很刺激。\n\n嘘——这一定不能让他们发现哦，不然就像曾经我的父母一样，会远离我，害怕我，最终将我送到那个破旧的医院。\n\n他们始终无法理解，有病的人不是我，而是他们。\n\n沈先生，你曾说过如果我有需要可以找你，我想是时候了，我有一个愿望。\n\n我希望能够终结那些垃圾的低等情绪，由我来终结。\n\n相信你一定会喜欢我的想法，期待你的回信。\n\n我要去上课了。`,

  '04': `写给沈先生的一封信\n\n信件邮寄时间：2014年7月17日。\n信件邮寄方式：晋州市同城邮寄。\n收信人：沈先生\n寄信人：追随您的"XXX"。\n\n我最好的朋友——沈先生。\n很久没有给您回信了，望您不要介意。\n\n实是因为我最近的生活一团糟糕，病情愈来愈严重，导致我根本无法和正常人一样生活。\n\n难过的时候，我总会想起一年前您将卡牌交到我手中的时候，您曾对我说过，如果有一天我需要您的帮助，您会帮我，现在这承诺不知是否还有效？\n\n我要跟您说说最近在我身上发生的事，说完，您便能理解我的病情有多么严重。\n\n前些日我刚刚被公司解聘，还挨了打。\n\n事情的起因是领导告知我们他的家人去世，他要回老家守丧的时候，我哈哈大笑，笑声响彻着整个办公室，所有同事都在看着我，像看一个小丑。\n\n但您知道，这不是我能控制的，我的嘴巴似被遥控般，根本不受我的控制，每当情绪涌现便会笑出声来。\n\n难过、伤心、兴奋、喜悦、痛苦……其他人的表达有千万种，而我只有一种，便是笑……\n\n我想撕烂自己的嘴，因为它使我根本无法生活，我去参加朋友的葬礼，当所有人都在为死者悼念时，却响起我的笑声……你能想象那种场面是什么样的情形吗？我遭受的是愤怒、冷眼、唾弃，他们仿佛在看一个神经病，每个人都在咒骂着我。\n\n我坐在公交车上，当孩子因车身晃动而发出哭声时，我本想哄她，笑声却将她吓得止住哭声，她的家人抱着孩子寒怕的离我远去。\n\n我已经快被折磨疯掉，我不敢出门，不敢见其他人，我怕他们将我抓起来，送进精神病院。\n\n我的笑容背后，只有痛苦和眼泪，没有人可以理解。\n除了你，我的朋友。\n你会帮助我的，对吗？\n你曾经承诺过的。\n\n希望能够收到你的回信，每一秒都在期待着……`,

  '05': `写给沈先生的一封信\n\n信件邮寄时间：2014年7月17日。\n信件邮寄方式：晋州市同城邮寄。\n收信人：沈先生\n寄信人：追随您的"XXX"。\n\n我最敬爱的沈先生，你好。\n自上次给你写信也有一段时间了，你还记得吗？我曾说过，当你在一年前交给我那张卡牌时，我便知道，你是这世上唯一懂我的人，我很高兴能有你这样的好友，能够让我漏出自己真实的面孔，无需感到着辱，也无需感到肮脏。\n\n我记得你在信件中曾对我说的那句话："爱情只是一种装饰，如钓者喂给鱼儿的美餐。"我极为认同这句话，因为我无法理解爱情，我的欲望控制着我，爱情是花言巧语，也可能是我满足欲望的手段，总之，我不懂爱情，也没有想法去理会。\n\n我的伴侣在随时更换，我那在别人眼中不堪的欲望，操控着我，不停地发泄着。\n\n那种快感令我迷失，仿佛毒品一般，我无法离开它，只要有一天不去体会，那便是无尽的折磨，会要我的命。\n\n我对女人其实没有很大的兴趣，我享受的只是和她们在床上鱼水之欢时，欲望被满足的感觉，可是这种快感随着每一次做爱结束，我就只剩下了空虚和失落感。\n\n我会发怒，会变得暴躁，那些女人怎么可能理会我的欲望？\n我需要的，只是她们的身体而已。\n\n我曾经也谈过恋爱，虽然我不爱她，但她对我很好，我想着可以和她一起生活下去。可我的欲望实在太大了，她无法满足我，渐渐地变得疏远我，说我变态，我只好在外面找各种办法满足自己，花钱也好，去约也好，最多的时候一天要约七八次……我快要疯了……欲望越来越大，仿佛无尽的深渊，永远也填不满。\n\n可但凡了解我的人，都说我有病，说我变态，说我是下半身思考的动物。\n可谁又真的理解我呢？\n\n不过最近我的生活中出了一些问题，我得了性病，不知是从谁那里传染的，当医生告诉我最近一个月都不能发泄欲望时……\n\n我就像断了毒品的吸毒者，我现在每分每秒都无法再忍受。\n\n我知道，你一定有办法的，求求你帮帮我！\n请你看到这封信后，一定要尽快回给我！\n一定！！！`,

  '06': `写给沈先生的一封信\n\n信件邮寄时间：2014年7月17日。\n信件邮寄方式：晋州市同城邮寄。\n收信人：沈先生\n寄信人：追随您的"XXX"。\n\n我最尊敬的沈先生，你好。\n很久没有给你写信了，因为这段时间我在学校尝试着融入校园生活，可...最终的结果令我失望....\n\n我确确实实无法和正常人一起生活，我的恐惧、颤抖都阻止着我的行动，哪怕和一个人说上两句话，身子都会颤束不已。\n\n还记得上次我跟你讲过，我根名参加了社团，当时我鼓起了二十多年来最大的勇气，想要和他们做朋友，一起生活。可在加入社团的当天，他们要我上台演讲，我是提前准备过的，而且准备了很长时间，希望自己不要搞砸。\n\n我不敢麻烦他人，只能在宿舍内看各种演讲视频，学习他们的动作和话语...我知道的，其实在那天我只需要自我介绍就好，不过几句话的事情，可我还是不放心……\n\n社团集会的当天，当部长让我们自我介绍的时候，我拿着准备好的几句话——我把它们写在了纸上，随后走上讲台，当我面对着近百人的目光，我的身子又控制不住的开始颤抖，额头、手心都在冒汗……\n\n他们每个人的目光都像刀子一样割开我的身体，绞痛着我的神经，我有一种感觉，他们都想看我出丑！\n\n我努力地平稳心情，可又不禁抬头看向他们，我看到的是每个人的脸都在扭曲变幻，他们的神情仿佛要吃掉我一般，我看到他们的嘴角微微上扬，漏出讥讽般的笑容……\n\n我的腿开始发软，我已经很久没有与人交流过了，嘴巴张了张，那些字堵在嗓子眼里，怎么也不愿意出来。\n\n我的大脑里响彻着一个声音：逃吧！逃吧！不要让自己难过，为什么一定要和他们交流呢？他们只想看我出丑！\n\n我感觉自己的眼泪都要流了出来，我做不到，真的做不到！\n我想要逃回寝室，将自己蒙在被子里，那个狭小的空间才会让我舒服。\n\n……我一句话都没有说出来，最终还是逃回了宿舍。\n\n沈先生，自那次后我就再也没有和别人讲过话了。\n我不想和其他人说话，也不想和其他人交朋友。\n我的朋友只有你。\n\n我知道你是无所不能的，请你帮帮我，不要再让我和其他人生活在一起了。\n我真的好累，好怕……`,

  '07': `写给沈先生的一封信\n\n信件邮寄时间：2014年7月17日。\n信件邮寄方式：晋州市同城邮寄。\n收信人：沈先生\n寄信人：追随您的"XXX"。\n\n我最亲爱的朋友——沈先生\n近来可好？\n\n已许久未与你联系，你知道的，我一直在帮助其他的人，希望能够带给他们美好的生活，给予他们快乐和幸福，这导致我异常的忙碌。\n\n可我发现，那些被我恩赐过的人却始终无法理解我，明明他们的生活很苦，我能够让他们摆脱和逃离困难，他们却骂我是精神病，这让我感到愤怒和不解！\n\n他们会失眠，在每一个无法入睡的夜里。\n他们会哭泣，在每一次他们遭遇伤害的时候。\n他们会恳求上天，在每一次生活不幸的时刻。\n\n可在我创造的世界里，他们无需烦忧，只要他们愿意进入我的世界，我便能让他们每个人都变得洒脱，无忧无虑。\n\n这难道不好吗？\n\n我每时每刻都能看到独角兽在空中飞行，洒下七彩的光芒，我能听到美人鱼在轻轻歌唱，温暖我的心灵…只要我想飞，我便能穿梭在云层之中，与老鹰作伴，听太阳讲述它的生活.....为什么他们不愿意和我共同享受这快乐呢？\n\n我不想一个人生活在美好的世界里，我希望帮助他们，当初你交给我那张卡牌的时候，一定也是希望我这样做的吧。\n\n沈先生，你曾说过我有需求便可以找你，现在我需要你帮我实现愿望。\n我要全世界的人都进入我的世界，与我一同观看那美妙的场景。\n\n我期待你的回信，你一定有办法的，对不对？`,

　　我尝试着打开柜子的门，上面的锁头是开着的，柜子里面却只搁了一件沾满灰尘的衣服。我将衣服拿出来抖了抖灰，借着灯光仔细的观看，衣服上面沾着许多泥土还有血迹，更令我注意到的是，这件衣服与更衣室里的其他衣服都不一样，他不是演出的戏服，而是生活中穿着的衣服。
　　我将衣服仔细地检查了一番，放了回去，确保没有什么其他的东西。
　　在衣柜的旁边的墙上有一面落地的大镜子，我站在镜子前照了照自己，昏暗的灯光将我的脸照得有些扭曲。而我这时注意到镜子下方的阴暗角落里，在光照不到的地方藏着一个垃圾桶。
　　我蹲下身，垃圾桶内堆满了垃圾，显然很久都没有收拾过了。我在垃圾桶里翻找了一翻，看到一些已经被烧毁的黑色碎纸，我将一些碎纸拿起来却感觉到不对劲，它们的触感并不是纸，通过材质来看的话，似乎是一些照片，被烧掉后扭曲变形的样子。
　　照片？
　　我的脑子里好像想到了什么，在垃圾桶内还有一张白纸，看边角是撕下来的日记，内容为：2014年7月1日。

　　我们又吵架了，他总是想回到家里去，因为这件事我们已经争吵过无数次，搞的整个剧组都不安宁，只希望争吵是短暂的，千万不要影响我的演出才好。

　　"时间到了"我的身后传来了殡仪的声音。
　　我感到有些混乱，转过身向门口走去。
　　"戴上眼罩吧"殡仪对我说道。
　　我随着他出了剧场回到了车上，和前两个地点一样，他不让我与任何人交谈，但我也在期待着其他人得到的将会是什么样的信息。
　　外面的雨好像停了，这一夜什么时候才会过去？` },
  'V4-WATCH': { name:'V4 · 打更老头', act:'第四幕·戲院', content:`打更老头

当我摊出道具，殡仪带着我来到了车上，其他人都站在外面等待着，我望着他，不知道这一次他会分享什么样的录音。
　　可没想到的，他竟从车里取出一本白色的翻递到了我的手中，我好奇地接过，借着车内微弱的灯光看去，似乎是一张不知道从哪撕下来的日记，日期：2014年7月9日。

我每天都在想这件事，都到快崩溃了的程度，拳拳，他以为这只是一套处理的游戏的问题，不清楚他为什么找回这样一件事，如何的……？
我根本不懂上面写的什么，又已经反复看了很多回，"它住了吗"？

　　打更人来了那，首先，他要不让说起，根据他的描述《傀儡》，只有他一个人演来，也只有他一个人能够演好，为此他拿来接正演的，在他身时是的里的帮助，是他的帮助了。

　　通过录音反应到报告，我们帮他进到的通道，获取的信息太多，看来是里是和其他人的相联才行。
　　殡仪打开了门，道："好，都你进这里等着，不要与他人说话。"
　　我一个人，静静地在车里，说不出的滋味……` },
  'V4-ACT': { name:'V4 · 对戏演员', act:'第四幕·戲院', content:`对戏演员

当我摊出道具，殡仪带着我来到了车上，其他人都站在外面等待着，我望着他，不知道这一次他会分享什么样的录事。
　　可没想到的，他竟从车里取出一本白色的递到了我的手中，我好奇地接过，借着车内微弱的灯光看去，似乎是一张不知道从哪撕下来的日记，日期：2014年7月10日。

我真的有一个奇怪的朋友，拳拳，即使他又提出这样的要求……我一开始以为这只是这么一个奇怪的游戏，后来慢慢的才开始理解……他真的喜欢这个世界，虽然各种各样的手法，各种各样的角度，说来说去，"它住了吗"？
我根本不懂上面写的什么，又已经反复看了很多回，"它住了吗"？

　　他也继继着了他，那他们的口由来，不为心里有些着这家，
　　他们之间的时候，"可以开始了吧。"

　　通过录音到反应到报告表，我们帮他进到他们的通道，获取的信息太多，看来是里是和其他人的相联才行。
　　殡仪打开了门，道："好，都你进这里等着，不要与他人说话。"
　　取出来，殡仪说：那就这样了。
　　我一个人，静静地在车里，说不出的滋味……` },
  'V4-MKP': { name:'V4 · 化妆间', act:'第四幕·戲院', content:`化妆间

殡仪为我带上了眼罩，有了前两个地点的经历，我的心脏跳动的更加迅速，我不知道即将看到什么，却能够想象到在这剧院内，隐藏着惊人的事情。
　　我开始好奇，死者是谁？他又经历了什么？
　　与前两个地点不同，我能够透过这道缝隙感受到光亮。
至少，不用在黑暗中摸索了。

　　当殡仪的脚步停止时，他的声音在耳畔响起："摘下眼罩吧。"
　　我迅速做出反应，将眼罩拿下，看到的是一扇黄褐色的门，有些老旧，在门上面贴着三个绿色的字：化妆间。
　　"可以进去了，这次只有三分钟的时间。"殡仪说，伸手率先地帮我打开了门。
　　我走进去的那一刹那，我愣了一下，霓虹灯的光亮迅速照亮了整个化妆台。我松了松掌心——因为此刻里面不止一个人。
　　化妆台前坐着两三个人，都身着戏服，正在化妆，其中一位年轻的女孩子，发型梳的极为精致，脸上的妆容让人惊艳，让人一眼就看到她。
　　我往化妆台的旁边走去，仔细翻看每一个台面，没有发现什么特别的东西。
　　在靠近化妆间角落的地方，有一个梳妆台上面贴着一个人名：秦冬。
　　我俯下身，在梳妆台上一看，在台面上检了一张白纸，看边角是撕下来的日记，内容为：2014年7月3日。

　　这样，对他们里面里面的里面的，可能是更喜欢这小，也是里面里面的里面，什么，是，这是，里，也不知一不一样里面里去观观里的里面，我要再这问他！

　　这时，我身后的门打开了。
　　"好了时间到了"，殡仪，转身向门口走去，离别之际，我望了一眼那个倒在地板上的人偶，他的身上掌着一件特别别致的东西。
　　"戴上眼罩"殡仪对我说过。
　　我随着他出了剧场回到了车上，和前两个地点一样，他不让我与任何人交谈，但我也在期待着其他人得到的将会是什么样的信息。
　　外面的雨好像停了，这一夜什么时候才会过去？` },
  'V4-STAGE': { name:'V4 · 剧场舞台', act:'第四幕·戲院', content:`剧场舞台

殡仪为我带上了眼罩，有了前两个地点的经历，我的心脏跳动的更加迅速，我不知道即将看到什么，却能够想象到在这剧院内，隐藏着惊人的事情。
　　我开始好奇，死者是谁？他又经历了什么？
　　殡仪拉扯着我的衣服，与前两个地点不同，我能够透过眼罩的缝隙感受到点点光亮。
至少，不用在黑暗中摸索了。

　　"摘下眼罩吧。"
当殡仪对我说出这句话时，我缓缓地摘下眼罩，眼前是一个空旷的场景。
　　"你只有三分钟的时间。"殡仪冷声道，随后转身离去。
入眼的是一片光亮，在我面前出现的是一座舞台，密密麻麻的人偶皆被吊挂在天棚上，垂下来后距离我的头顶不过半米。
只是头顶的灯是红色的，使得整个空间显得诡异而虚幻，不仔细看，如同十几具活生生的尸体被吊死在头顶，让人心生惶惧。
每一具人偶都穿着各式各样的衣服，哪怕知道他们是人偶，却依然有被死死盯着的感觉，可明明我可以看得到他们的脸上是木头的，连五官都没有雕刻。
　　我仔细地观察着每一具人偶，很好奇他们这种布置，是演出什么样的戏？我从未见过如此恐怖的舞台剧。
　　正在我好奇时，我注意到舞台上吊挂的人偶中，有一具显得有些奇怪，那具人偶的身体是倾斜的，呈一个斜着的角度，和其他笔直的人偶挂在一起，有些突兀，是绳子吊挂的方向问题吗？
　　在那具人偶下方的地板上，我注意到一张白色的纸，拿起来仔细看了看，似乎是不知道从哪撕下来的日记，内容为：2014年7月9日。

　　这个疯子，他杀人了吗？我不敢想象，我要问他，究竟怎么回事！

　　舞台的前方是一块大红色的幕布，遮挡住了舞台和观众席之间，我想要偷偷扒开幕布向观众席看去。
　　"咳咳！"
　　我听到了一个咳嗽的声音，吓的我身体一颤，我回过头，看到殡仪在舞台的角落里盯着我。
　　似乎是我的举动惹怒了他，他向我走来。
　　"时间到了。"
　　我望着他摊了摊手，射灯将他的身体也映成红色。
　　我轉過身向他的方向走去，離別之際，我回頭看了眼吊在舞台上的十幾具人偶，總覺得哪裡有點不太對勁。
　　「戴上眼罩吧」殯儀對我說道。
　　我無奈的隨著他出了劇場回到了車上，和前兩個地點一樣，他不讓我與任何人交談，但我也在期待著其他人得到的將會是什麼樣的信息。
　　外面的雨好像停了，這一夜什麼時候才會過去？` },
  'A01-LOW': { name:'雍九的日记残页', act:'第五幕·私人', content:`雍九的日记残页\n\n2014年7月21日。\n\n我站在坟墓前，安静地看着棺材内的他，我的心也随之静默下来，他曾经是我最好的徒弟，也是审判者最好的人选……\n\n他的死是值得的……当我在三天前杀死他时，才第一次见到他的模样，虽然比我想象中老一些，但还是让我倍感亲切，也许我真的太孤独了……我将他最喜欢的那本《昨日救赎》放在他的棺材内，他的尸体上，我已经不需要那本书了。\n\n我伪装成他，给那七个人发了邮件，相信他们就快要到了，今夜过后，我也不再需要任何人。` },
  'A02-SAC': { name:'《昨日救赎2》的内容', act:'第五幕·私人', content:`《昨日救赎2》的内容\n\n当他写下这本书的时候，便重新为十二张卡牌制定了规则，获得卡牌的人除非死去或者与其他持有卡牌的人交换，否则卡牌将永远不会离开持有者！\n没有人能够逃脱卡牌的光芒。\n当卡牌的杀戮开始后，十二天内必须收回十二张卡牌，否则仪式失败，已死去的持有者的卡牌，将再也无法发出。\n\n——第三卷第二节《卡牌的规则》` },
  'A03-EXE': { name:'雍九的日记残页', act:'第五幕·私人', content:`雍九的日记残页\n\n2013年6.2日。\n\n十张卡牌，十种病态，我真是天才，还有什么人比他们更符合卡牌的内容呢？\n\nPBA症状（笑脸综合征）、自闭症、性瘾、抑郁症、臆想症、社交恐惧症、反社会人格……我终于找到了符合卡牌的人……\n\n我静静地注视着他们，如天神在选择他的幸运儿，我会帮他们每一个人实现愿望，让我的光芒笼罩于他们每一个人的身体。\n\n现在，就差一张卡牌了。\n\n我要招募一个可靠的审判者，来替我杀死他们，完成这一切！\n\n上次给我写信的那个孩子，他是不是好的人选呢？` },
  'A04-FAC': { name:'雍九的日记残页', act:'第五幕·私人', content:`雍九的日记残页\n\n我为他们七个人，准备好了一份礼物，那是一个微型炸弹。\n\n我已经没有时间再去选择一个新的审判者了。\n\n那就只好，由我来做审判者！\n\n今晚，我会将十一张卡牌，都收回来！\n\n今晚，不只是他的葬礼，也是他们七个人的葬礼！\n\n——2014年7月21日` },
  'A05-HUN': { name:'《昨日救赎2》', act:'第五幕·私人', content:`《昨日救赎2》\n\n房间内有一本名为《昨日救赎2》的书，出版日期为2013年1月，作者是雍九。\n书中第一章名为：救赎之路。\n章内讲述了世间有12张卡牌，卡牌的名字分别为：审判者、窥探者、迷途者、傀儡师、猎心师、伪面者、牺牲者、执刑者、匿行者、筑梦师、低语者……后面还有一张卡牌的名字被抹掉了。\n十二张卡牌代表人世间十二种劣根性，传说找到代表十二张卡牌欲望的人，便可抹杀持有世间的十二种罪恶，净化世界。\n但书中规定，只有持有审判者卡牌的人，才有资格审判他们的生命。` },
  'A06-WAL': { name:'沈先生电脑上的聊天记录', act:'第五幕·私人', content:`沈先生电脑上的聊天记录\n\n雍九：审判者的卡牌是十二张中最重要的，我慎之又慎，选择能够持有这张卡牌的人。曾经我以为你是最适合它的，没想到，你竟然做出这样的事，如今看来，你根本不配持有"审判者"。\n沈先生：我错了吗？是你变了，我做的这些事完全符合那本书！\n雍九：口出狂言！\n雍九：我问你，那三个人的死是怎么回事，是谁让你这么做的？\n沈先生：不该是这样么？当年将卡牌交给他们时，就注定是这样的结果！\n雍九：卡牌是我的！背叛我的下场是什么？无论你躲在哪里，你都逃不掉的。\n沈先生：别忘了，审判者的卡牌你拿不走，除非我死了。\n雍九：是啊，是啊，当初就不该选择你，但卡牌，我一定会收回来。\n沈先生：你听说过一句话吗？\n雍九：呵呵。\n沈先生：当信仰崩塌时，你只有两个选择，要么随之一同崩塌，要么……\n雍九：蚍蜉撼树\n雍九：你会死的，我会让那本书随你一同埋葬，是我对你的恩赐。\n沈先生：死亡……仅仅是个开始……` },
  'A07-DRE': { name:'写给雍九的信', act:'第五幕·私人', content:`写给雍九的信\n\n雍九，您好！很抱歉以这种方式来告诉您，这是我第一次也是最后一次给您写信，您曾经多次帮助过我，您给了我一次又一次的机会，我感激您以往对我的关怀和照顾，谢谢您！\n\n我是一个可怜的孩子，在我很小的时候，我的父亲就不在了，我对父亲没有什么印象，唯一记得的，就是他给我的一封信，那封信里写着："你什么都做不到！"我就不知道为什么，也许因为从小我父亲就不在我身边，因此有关父亲的一切都成了我心里的一道坎，我也对自己失去了信心。\n在那以后，我的生活也越来越……\n\n……记得您曾经告诉我，您有一本非常重要的书，那本书里讲述了关于灵魂救赎的一切……\n\n……我的母亲去世那一年，那一天，那一刻，我亲手将刀……\n我离不开那个秘密。\n……\n我想要告诉您的秘密是：\n我患有强迫性思维的幻想症。\n我爱着您给我的那个世界！\n在那里花儿永远不会凋谢，呵呼叫着，就像它们一直活着。\n\n我的信念终于坚定了。\n我现在只想告诉您一件事：\n我终于找到我的审判者了。\n\n——名字不是重要的事情` },
  // B系列 — 第二本第一幕線索（沈先生U盤文件）
  'B01-POL': { name:'警方報告', act:'第二本·壹', content:`【警方報告】\n日期：2014年7月22日\n\n事件：爆炸案\n地點：蒼語山墓園，苦語山附近\n\n報告摘要：\n2014年7月22日凌晨，接獲市民報案，稱蒼語山墓園附近發生爆炸，火光沖天。\n\n現場搜查發現殘留物及一具遺骸，初步鑒定死亡時間約為7月17日至18日之間。\n\n遺骸身份尚未確認。現場發現多枚疑似手工製作的起爆裝置碎片。\n\n調查仍在進行中。` },
  'B02-FILE': { name:'精神病院簡歷', act:'第二本·壹', content:`【精神病院簡歷】\n\n姓名：鄧治\n性別：男\n年齡：40歲（入院時）\n診斷：反社會人格障礙\n入院日期：2011年5月\n主治醫生：小花（化名）\n\n病歷摘要：\n患者有長期暴力行為記錄，對他人缺乏共情能力。\n童年創傷史，曾遭繼父長期虐待。\n入院後情緒波動明顯，對主治醫師表現出極度的依賴與敵意並存的複雜情感。\n\n備注：該患者已于2013年4月逃院，目前下落不明。` },
  'B03-INFO': { name:'警方信息', act:'第二本·壹', content:`【警方信息】\n日期：2013年4月\n\n事件：精神病院逃人事件\n地點：苦語山精神病院\n\n事發經過：\n2013年4月，苦語山精神病院發生一名患者逃院事件。\n逃院患者身份：鄧治，反社會人格障礙患者。\n\n逃院前，患者對主治醫生實施了性侵犯。\n醫生受到嚴重心理創傷，事後申請了長期休假，離開了該醫院。\n\n鄧治的下落至今未查明。警方持續追緝中。` },

function autoDistribute(gmUnlocked) {
  if (!myChar) return;
  let added = false;
  Object.keys(gmUnlocked || {}).forEach(code => {
    if (!gmUnlocked[code]) return;
    if (myUnlocked.includes(code)) return;
    if (!CLUE_DATA[code]) return;
    const dist = CLUE_DIST[code];
    if (!dist) return;
    if (dist.type === 'public') {
      myUnlocked.push(code);
      added = true;
    } else if (dist.type === 'private' && dist.target && dist.target === myChar.name) {
      myUnlocked.push(code);
      added = true;
    }
  });
  if (added) {
    savePlayerState();
    renderUnlockedClues();
    showToast('📨 收到新線索！');
  }
}

// ---- GM State ----
let lastBroadcastCount = 0;

function applyGMState(newState) {
  const prevBroadcasts = (gmState.broadcasts || []).length;
  gmState = newState;
  updatePhaseIndicator();
  if (window._script) renderAct(currentAct);
  updateBook2Tab();

  const newBroadcasts = (gmState.broadcasts || []).length;
  if (newBroadcasts > prevBroadcasts && prevBroadcasts > 0) {
    const latest = gmState.broadcasts[0];
    showToast('📢 ' + (latest ? latest.msg.substring(0, 40) : '主持人有新通知'));
    // Add red dot to broadcast tab
    const broadcastBtn = document.querySelector('.ptab-btn[onclick*="broadcast"]');
    if (broadcastBtn && !broadcastBtn.classList.contains('active')) {
      broadcastBtn.setAttribute('data-badge', '●');
      broadcastBtn.style.position = 'relative';
      if (!document.getElementById('broadcastDot')) {
        const dot = document.createElement('span');
        dot.id = 'broadcastDot';
        dot.style.cssText = 'position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#e05555';
        broadcastBtn.appendChild(dot);
      }
    }
  }

  if (document.getElementById('ptab-broadcast') && document.getElementById('ptab-broadcast').classList.contains('active')) {
    renderBroadcast();
  }

  autoDistribute(newState.unlocked);
}

function subscribeToGMState() {
  if (!sessionId) return;
  _supa.from('game_state').select('state').eq('id', sessionId).single()
    .then(({ data }) => { if (data && data.state) applyGMState(data.state); });
  _supa.channel('gm_state_player_' + sessionId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game_state', filter: `id=eq.${sessionId}` },
      payload => { if (payload.new && payload.new.state) applyGMState(payload.new.state); })
    .subscribe();
}

// ---- Player State ----
async function savePlayerState() {
  if (!sessionId || !myChar) return;
  const row = { id: playerKey(), session_id: sessionId, char_id: myChar.id, player_name: myName, unlocked_codes: myUnlocked, updated_at: new Date().toISOString() };
  try { await _supa.from('player_state').upsert(row); } catch(e) { console.warn('player state save error', e); }
  // also localStorage backup
  localStorage.setItem('ps_' + playerKey(), JSON.stringify(row));
}

async function loadPlayerState() {
  if (!sessionId || !myChar) return false;
  try {
    const { data } = await _supa.from('player_state').select('*').eq('id', playerKey()).single();
    if (data) {
      myName = data.player_name || '';
      myUnlocked = Array.isArray(data.unlocked_codes) ? data.unlocked_codes : [];
      return true;
    }
  } catch(e) {}
  // fallback to localStorage
  try {
    const local = JSON.parse(localStorage.getItem('ps_' + playerKey()) || 'null');
    if (local) { myName = local.player_name || ''; myUnlocked = local.unlocked_codes || []; return true; }
  } catch(e) {}
  return false;
}

    <div class="char-info-name">${c.id} · ${c.name}</div>
    <span class="char-info-tag">${myName}</span>
    <div style="font-size:0.78rem;color:var(--muted);margin-top:6px;margin-bottom:20px;font-style:italic">${letter.hint}</div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:20px 18px;margin-bottom:20px;font-size:0.83rem;line-height:1.9;white-space:pre-wrap;font-family:inherit">${introLetter}</div>
    <div style="margin-top:4px;padding:10px 14px;background:#1a1a1a;border-radius:8px;font-size:0.8rem;color:var(--accent);text-align:center;margin-bottom:20px">📌 弹窗：沈先生赠予你的卡牌（你的身份）是什么？</div>
    <div class="act-nav" id="actNav"></div>
    <div id="actContent"></div>
  `;

  window._script = script;
  window._book2Script = getBook2Script(c.id, c.name);
  renderAct(0);

  document.getElementById('questGuide').style.display = 'none';
}

function renderAct(idx) {
  currentAct = idx;
  const script = window._script;
  const act = script[idx];

  // Nav buttons
  const nav = document.getElementById('actNav');
  if (nav) {
    nav.innerHTML = script.map((a, i) =>
      `<button class="act-nav-btn ${i === idx ? 'active' : ''}" onclick="renderAct(${i})">${a.title.split('·')[0].trim()}</button>`
    ).join('');
  }

  const contentDiv = document.getElementById('actContent');
  if (!contentDiv) return;

  if (act.locked) {
    const unlocked = (gmState.unlocked || {})[act.lockCode] || myUnlocked.includes(act.lockCode);
    if (!unlocked) {
      contentDiv.innerHTML = `
        <div style="text-align:center;padding:32px 16px;color:var(--muted)">
          <div style="font-size:2rem;margin-bottom:8px">🔒</div>
          <p style="font-size:0.85rem">等待主持人開放此幕</p>
          <p style="font-size:0.75rem;margin-top:6px;color:#555">代碼：${act.lockCode}</p>
        </div>
      `;
      return;
    }
  }

  contentDiv.innerHTML = `
    <div class="script-reader">
      <div class="script-act-title">${act.title}</div>
      <div class="script-body">${act.content.replace(/\n/g, '<br>')}</div>
      <div style="display:flex;justify-content:space-between;margin-top:16px">
        ${idx > 0 ? `<button class="act-nav-inline" onclick="renderAct(${idx-1})">← 上一幕</button>` : '<span></span>'}
        ${idx < script.length - 1 ? `<button class="act-nav-inline" onclick="renderAct(${idx+1})">下一幕 →</button>` : '<span style="color:var(--muted);font-size:0.8rem">（劇本完）</span>'}
      </div>
    </div>
  `;
}

function updatePhaseIndicator() {
  const PHASE_NAMES = ['入場+選角','開場微演繹','第一幕：信件','第二幕：別墅','第三幕：門市','第四幕：戲院','第五幕：沈先生家','結尾'];
  const idx = gmState.currentPhase || 0;
  document.getElementById('phaseIndicator').textContent = '當前：' + (PHASE_NAMES[idx] || '等待開始');
}

// ============================================================
// CLUES
// ============================================================
async function unlockClue() {
  const input = document.getElementById('codeInput');
  const code = input.value.trim().toUpperCase();
  const errDiv = document.getElementById('codeError');
  errDiv.textContent = '';
  if (!code) return;

  // Check GM has unlocked it
  const gmUnlocked = gmState.unlocked || {};

  if (CLUE_DATA[code]) {
    if (!gmUnlocked[code] && !gmUnlocked[code.toLowerCase()]) {
      // Still allow player to unlock if they have the code (GM may have given verbally)
      // But show a warning
    }
    if (myUnlocked.includes(code)) {
      errDiv.textContent = '這個線索已經解鎖了！';
      return;
    }
    myUnlocked.push(code);
    await savePlayerState();
    input.value = '';
    renderUnlockedClues();
    showToast('✅ 線索解鎖：' + CLUE_DATA[code].name);
  } else {
    errDiv.textContent = '❌ 代碼不正確，請確認後重新輸入';
    showToast('代碼無效', true);
  }
}

function renderUnlockedClues() {
  const div = document.getElementById('unlockedClues');
  if (!myUnlocked.length) {
    div.innerHTML = `
      <div class="empty-state">
        <div class="icon">🔒</div>
        <p>尚未解鎖任何線索<br>向主持人索取代碼，輸入後即可查看</p>
      </div>
    `;
    return;
  }
  div.innerHTML = [...myUnlocked].reverse().map(code => {
    const c = CLUE_DATA[code];
    if (!c) return '';
    return `
      <div class="clue-item">
        <div class="clue-item-header">
          <span class="clue-item-name">📄 ${c.name}</span>
          <span class="clue-item-code">${code}</span>
        </div>
        <div style="font-size:0.72rem;color:var(--muted);margin-bottom:6px">${c.act}</div>
        <div class="clue-item-body">${c.content}</div>
      </div>
    `;
  }).join('');
}

// ============================================================
// BROADCAST
// ============================================================
function renderBroadcast() {
  // Clear red dot when opening broadcast tab
  const dot = document.getElementById('broadcastDot');
  if (dot) dot.remove();
  const list = document.getElementById('broadcastList');
  const broadcasts = gmState.broadcasts || [];
  if (!broadcasts.length) {
    list.innerHTML = '<div class="no-broadcast">🔇 尚無主持人通知</div>';
    return;
  }
  list.innerHTML = broadcasts.map(b => `
    <div class="broadcast-item">
      <div class="broadcast-time">${b.time}</div>
      ${b.msg}
    </div>
  `).join('');
}

// ============================================================
// TABS
// ============================================================
function switchPTab(id) {
  document.querySelectorAll('.ptab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.ptab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('ptab-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
  if (id === 'broadcast') renderBroadcast();
  if (id === 'clues') renderUnlockedClues();
  updatePhaseIndicator();
}

// ============================================================
// URL PARAMS
// ============================================================
function checkURLParams() {
  const params = new URLSearchParams(window.location.search);
  const charId = params.get('char');
  if (charId) selectChar(charId);
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// ============================================================
// INIT
// ============================================================
async function init() {
  // Try to restore session
  const savedSession = localStorage.getItem('player_session_id');
  const savedCharId = localStorage.getItem('player_char_id');

  if (savedSession && savedCharId) {
    sessionId = savedSession;
    myChar = CHARACTERS.find(c => c.id === savedCharId);
    if (myChar) {
      const restored = await loadPlayerState();
      if (restored && myName) {
        subscribeToGMState();
        showApp();
        return;
      }
    }
  }

  // No saved session — show session join screen
  if (savedSession) {
    sessionId = savedSession;
    showIntroScreen();
  } else {
    document.getElementById('sessionScreen').style.display = 'block';
  }
  checkURLParams();
}

init();
</script>
</body>
</html>
