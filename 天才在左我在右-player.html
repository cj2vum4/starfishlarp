<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天才在左 我在右｜玩家端</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #080810;
    --surface: #10101e;
    --surface2: #18182a;
    --accent: #c8a97e;
    --accent2: #e8c49e;
    --red: #e05555;
    --green: #55c48a;
    --blue: #5599e0;
    --purple: #9055e0;
    --text: #e8e0d0;
    --muted: #6a6a8a;
    --border: #202038;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif TC', '思源宋體', Georgia, serif;
    min-height: 100vh;
  }

  /* ---- SESSION + INTRO SCREEN ---- */
  #sessionScreen, #introScreen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at center, #1a1030 0%, #080810 70%);
  }
  .intro-title {
    font-size: 1.6rem;
    color: var(--accent);
    text-align: center;
    letter-spacing: 0.15em;
    margin-bottom: 6px;
  }
  .intro-sub {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    margin-bottom: 32px;
    letter-spacing: 0.08em;
  }
  .char-select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 700px;
    margin-bottom: 24px;
  }
  .char-select-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .char-select-card:hover, .char-select-card.selected {
    border-color: var(--accent);
    background: var(--surface2);
  }
  .char-select-card.selected { box-shadow: 0 0 16px rgba(200,169,126,0.3); }
  .csc-num {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    font-weight: bold;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 8px;
  }
  .csc-name { font-size: 1rem; color: var(--text); }
  .csc-desc { font-size: 0.72rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .name-input {
    width: 100%;
    max-width: 320px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    text-align: center;
    margin-bottom: 16px;
  }
  .name-input:focus { outline: none; border-color: var(--accent); }
  .enter-btn {
    padding: 12px 36px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: all 0.2s;
  }
  .enter-btn:hover { background: var(--accent2); }
  .enter-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---- MAIN APP ---- */
  #appScreen { display: none; }
  .app-header {
    background: linear-gradient(135deg, #08080f 0%, #141028 100%);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .app-header-left { display: flex; align-items: center; gap: 12px; }
  .my-char-badge {
    background: var(--accent);
    color: #000;
    font-size: 0.8rem;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }
  .app-title { font-size: 1rem; color: var(--accent); letter-spacing: 0.08em; }
  .phase-indicator {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: right;
    line-height: 1.4;
  }
  /* TABS */
  .ptabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ptabs::-webkit-scrollbar { display: none; }
  .ptab-btn {
    padding: 12px 18px;
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.88rem;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .ptab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--surface2); }

  /* CONTENT */
  .pcontent { padding: 20px; max-width: 700px; margin: 0 auto; }
  .ptab-panel { display: none; }
  .ptab-panel.active { display: block; }

  /* CARD */
  .pcard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .pcard-title {
    font-size: 0.95rem;
    color: var(--accent);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.08em;
  }
  /* CLUE INPUT */
  .clue-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .clue-code-input {
    flex: 1;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 0.95rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .clue-code-input:focus { outline: none; border-color: var(--accent); }
  .clue-submit-btn {
    padding: 10px 20px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .clue-submit-btn:hover { background: var(--accent2); }

  /* UNLOCKED CLUE */
  .clue-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .clue-item-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .clue-item-name { font-size: 0.9rem; color: var(--accent2); }
  .clue-item-code {
    font-family: monospace;
    font-size: 0.72rem;
    color: var(--muted);
    background: var(--surface);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .clue-item-body {
    font-size: 0.88rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }
  /* ERROR */
  .error-msg {
    color: var(--red);
    font-size: 0.82rem;
    margin-top: 6px;
    min-height: 18px;
  }
  /* CHARACTER INFO */
  .char-info-name {
    font-size: 1.4rem;
    color: var(--accent);
    margin-bottom: 6px;
    letter-spacing: 0.1em;
  }
  .char-info-tag {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.78rem;
    padding: 3px 10px;
    border-radius: 12px;
    margin: 3px 3px 3px 0;
  }
  .char-info-desc {
    margin-top: 14px;
    font-size: 0.9rem;
    line-height: 1.9;
    color: var(--text);
    background: var(--surface2);
    border-left: 2px solid var(--accent);
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
  }
  /* NOTICE */
  .notice {
    background: #1a1a08;
    border: 1px solid #4a4a18;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.85rem;
    line-height: 1.7;
    color: #d0c870;
    margin-bottom: 14px;
  }
  /* BROADCAST */
  .broadcast-item {
    background: var(--surface2);
    border-left: 2px solid var(--accent);
    padding: 10px 14px;
    margin-bottom: 8px;
    border-radius: 0 6px 6px 0;
    font-size: 0.88rem;
    line-height: 1.6;
    animation: fadeIn 0.3s ease;
  }
  .broadcast-time { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
  .no-broadcast { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 20px; }
  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.85rem;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    z-index: 999;
    max-width: 280px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { border-color: var(--red); color: var(--red); }
  /* SCRIPT READER */
  .act-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .act-nav-btn {
    padding: 5px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .act-nav-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .act-nav-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
  .script-act-title {
    font-size: 1rem;
    color: var(--accent2);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.08em;
  }
  .script-body {
    font-size: 0.88rem;
    line-height: 2;
    color: var(--text);
  }
  .act-nav-inline {
    padding: 7px 16px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--accent);
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .act-nav-inline:hover { background: var(--accent); color: #000; border-color: var(--accent); }
  /* TIMELINE */
  .mini-tl { font-size: 0.82rem; }
  .mtl-item {
    display: flex;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    line-height: 1.6;
  }
  .mtl-date { min-width: 80px; color: var(--accent); font-size: 0.78rem; padding-top: 2px; }
  .mtl-desc { flex: 1; color: var(--text); }
  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 2rem; margin-bottom: 8px; }
  .empty-state p { font-size: 0.85rem; line-height: 1.6; }
  .act-nav-inline-dup {
    display: none; /* duplicate removed */
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .act-nav-inline:hover { background: var(--accent); color: #000; border-color: var(--accent); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- SESSION JOIN SCREEN -->
<div id="sessionScreen" style="display:none">
  <div class="intro-title">⚖️ 天才在左，我在右</div>
  <div class="intro-sub">輸入主持人提供的場次代碼</div>
  <input class="name-input" id="sessionCodeInput" placeholder="場次代碼（例如：TC-AB12）" maxlength="20"
    style="text-align:center;letter-spacing:0.15em;font-size:1.1rem;text-transform:uppercase"
    oninput="this.value=this.value.toUpperCase()" />
  <button class="enter-btn" onclick="joinSession()" style="margin-top:12px">加入場次</button>
  <div id="sessionError" style="color:#e05555;font-size:0.82rem;margin-top:10px;text-align:center"></div>
</div>

<!-- INTRO SCREEN -->
<div id="introScreen" style="display:none">
  <div class="intro-title">⚖️ 天才在左，我在右</div>
  <div class="intro-sub" id="introSessionBadge">劇本殺玩家端 — 選擇你的角色</div>
  <div class="char-select-grid" id="charSelectGrid"></div>
  <input class="name-input" id="playerNameInput" placeholder="輸入你的名字（暱稱）" />
  <button class="enter-btn" id="enterBtn" onclick="enterGame()" disabled>進入遊戲</button>
</div>

<!-- MAIN APP -->
<div id="appScreen" style="display:none">
  <div class="app-header">
    <div class="app-header-left">
      <span class="my-char-badge" id="myCharBadge"></span>
      <span class="app-title">天才在左，我在右</span>
    </div>
    <div class="phase-indicator" id="phaseIndicator">等待主持人開場</div>
  </div>
  <div class="ptabs">
    <button class="ptab-btn active" onclick="switchPTab('story')">📖 我的劇本</button>
    <button class="ptab-btn" onclick="switchPTab('clues')">🔍 線索解鎖</button>
    <button class="ptab-btn" onclick="switchPTab('broadcast')">📢 主持人通知</button>
    <button class="ptab-btn" onclick="switchPTab('timeline')">📅 案件時間軸</button>
    <button class="ptab-btn" id="book2Tab" style="display:none" onclick="switchPTab('book2')">📕 第二本劇本</button>
  </div>
  <div class="pcontent">

    <!-- MY STORY -->
    <div class="ptab-panel active" id="ptab-story">
      <div class="pcard">
        <div class="pcard-title">🎭 我的角色</div>
        <div id="myCharInfo"></div>
      </div>
      <div class="pcard" id="questGuide">
        <div class="pcard-title">📋 你的問卷提示</div>
        <div id="questGuideContent"></div>
      </div>
    </div>

    <!-- CLUES -->
    <div class="ptab-panel" id="ptab-clues">
      <div class="pcard">
        <div class="pcard-title">🔍 輸入線索代碼</div>
        <div class="notice">
          📌 主持人會在每個場景發放線索代碼。輸入代碼後即可查看對應線索內容。<br>
          代碼不分大小寫，例如：<code style="color:var(--green)">V2-BM01</code>
        </div>
        <div class="clue-input-row">
          <input class="clue-code-input" id="codeInput" placeholder="輸入代碼..." maxlength="20"
            onkeydown="if(event.key==='Enter')unlockClue()" />
          <button class="clue-submit-btn" onclick="unlockClue()">解鎖</button>
        </div>
        <div class="error-msg" id="codeError"></div>
      </div>
      <div id="unlockedClues"></div>
    </div>

    <!-- BROADCAST -->
    <div class="ptab-panel" id="ptab-broadcast">
      <div class="pcard">
        <div class="pcard-title">📢 主持人通知</div>
        <div id="broadcastList"></div>
      </div>
    </div>

    <!-- BOOK 2 -->
    <div class="ptab-panel" id="ptab-book2">
      <div class="pcard">
        <div class="pcard-title">📕 第二本劇本</div>
        <div class="act-nav" id="book2Nav"></div>
        <div id="book2Content"></div>
      </div>
    </div>

    <!-- TIMELINE -->
    <div class="ptab-panel" id="ptab-timeline">
      <div class="pcard">
        <div class="pcard-title">📅 公開時間軸</div>
        <p style="font-size:0.78rem;color:var(--muted);margin-bottom:12px">以下為主持人公開的案件背景，更多細節需透過線索解鎖。</p>
        <div class="mini-tl">
          <div class="mtl-item"><div class="mtl-date">2014.07.10</div><div class="mtl-desc">第一起命案發生</div></div>
          <div class="mtl-item"><div class="mtl-date">2014.07.11</div><div class="mtl-desc">第二起命案發生</div></div>
          <div class="mtl-item"><div class="mtl-date">2014.07.12</div><div class="mtl-desc">第三起命案發生</div></div>
          <div class="mtl-item"><div class="mtl-date">2014.07.21</div><div class="mtl-desc">葬禮儀式（今天）</div></div>
          <div class="mtl-item"><div class="mtl-date">現在</div><div class="mtl-desc">你收到邀請，來到了這裡……</div></div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// DATA
// ============================================================
// ============================================================
// BOOK 2 DATA
// ============================================================
const BOOK2_LETTERS = {
  '01': `寄給沈先生：

沈先生，您好。

我是一名八卦記者。我的起步，靠的便是您給我的消息。那些獨家爆料讓我一路走到了今天的位置。

但我有一件心事，一直壓在我心底——

我的父母是普通工薪族，省吃儉用了一輩子。三年前，他們在網上買了一款保健品，被人騙了幾十萬。那些錢，是他們一生的積蓄。騙局被揭穿後，他們沒能承受那份打擊……他們選擇了自盡。

事後我查了很久，那個騙子換了身份，繼續行騙，從未受到任何懲罰。

沈先生，我希望能夠通過您的關係，幫我找到那個害死我父母的王八蛋。

我要殺了他。`,

  '02': `寄給沈先生：

沈先生，您好。

我曾是一名在讀大學生。三年前，我的室友在一家酒吧遭到侵害。我陪她去報案，也作了證，幫她找律師，替她出頭。

但事情的走向完全超出我的預料。

一個匿名博主在網上大肆發文，說我的室友是妓女，說我是共謀，說我們是為了勒索才報警。帖子轉發了幾十萬次。

我父親看到那些帖子，活活氣死了。我母親被鄰居知道後，遭人毆打。

我做了整容手術，換了一張新臉，重新開始了生活。

但我找不到那個博主。

沈先生，我希望能找到那個曾經在網上發表不實言論的人。

我想，我已經推開了這一扇殺人之門。`,

  '03': `寄給沈先生：

沈先生，您好。

我曾坐過三年冤獄。

入獄的理由是強姦，但那件事從頭到尾都不是我做的。有人故意陷害我，有人作了假口供指認我。我在牢裡待了三年，出來的時候，我媽已經不在了——她沒能撐過那三年的羞辱。

出獄後，我做了一名快遞員。我用業餘時間，把那些我認為不該活著的人，一個一個送走了。

三年前，您公寓爆炸事件發生那天，我正好去您那邊送貨。我注意到了一個細節——一個人，在您家附近鬼鬼祟祟。

沈先生，那個給我作了假口供、害死我媽的人，我一直沒找到。

我希望您幫我找到他。`,

  '04': `寄給沈先生：

沈先生，您好。

我是一名律師。

我這一生都戴著面具活著——微笑、克制、無懈可擊。在法庭上，我為有錢人辯護，有時候是明知他們有罪的情況下。

有一件事我從未對任何人說過：三年前，我代理了一宗房產詐騙案。我贏了，但我知道我的委託人是真的騙了人。那個被害人，後來跳樓了。

我沒辦法繼續假裝什麼都沒發生。

沈先生，我的願望不是復仇。我只想找一個地方，一個不需要偽裝的地方。

如果世界上有那樣一個地方，我願意用一切去換。`,

  '05': `寄給沈先生：

沈先生，您好。

我曾是一名網紅主播，靠您給我的資源一路走紅。

但三年前發生了一件事，讓一切歸零。

我的隔壁住著一個律師，他家的保姆和他有染。那天晚上，他們吵架，不知怎麼起了火。我的房間被殃及，我被燒傷了大半張臉。

警察最後只抓了保姆，說是保姆蓄意縱火。那個律師毫髮無傷，繼續做他的人上人。

沈先生，請幫我找到他。

我要親手毀了他。`,

  '06': `寄給沈先生：

  'V2-MAP': { name:'別墅地圖', act:'第二幕·別墅', content:`【別墅地圖】\n\n七個可搜索地點：\n① 地下室（照片牆）\n② 臥室（報紙、日記）\n③ 廚房\n④ 花園（大樹、泥土）\n⑤ 屋頂（花盆）\n⑥ 保姆室（保姆證詞）\n⑦ 車庫\n\n提示：大主人的名字由兩條線索組合得出。她的職業有一個意外的特徵——她同時是兩種身份？` },
  'V2-PH01': { name:'地下室照片牆', act:'第二幕·別墅', content:`【地下室照片牆】\n\n照片按日期排列，但有個奇怪的地方——有幾張是同一天的，卻記錄了完全不同的「記憶」，彷彿是兩個不同的人拍的。\n\n部分照片上有人，卻被模糊處理，彷彿刻意隱去身份。\n\n最早的幾張照片旁邊有一張報紙，標題出現了一個名字。` },
  'V2-POT': { name:'房頂花盆', act:'第二幕·別墅', content:`【屋頂花盆】\n\n花盆裡種著一株不知名植物，根系非常深。\n\n仔細挖掘花盆後，發現底部藏有——\n\n（此為高度敏感線索，建議公開前先詢問主持人）\n\n📌 主持人提示：阿花的頭部藏於此，結合大樹下的身體，她以自己的方式「守護這個家」。` },
  'V2-ROOF': { name:'V2 · 房頂', act:'第二幕·別墅', content:`【房頂】

我選擇了房頂，殯儀讓其他人在外面等待，單獨帶我進入別墅，一路帶著眼罩摸索著樓梯向上走，每一步都戰戰兢兢。
　　當我們到達頂樓時，殯儀叫我摘下眼罩。

　　「摘下來！」
　　入眼是一個寬闊的房頂，周邊是玻璃護欄，視野拓展開了很遠，這棟別墅確實非常大。
　　「你只有三分鐘的時間，記住你看到的一切！」殯儀說道，隨後退到一旁。

　　房頂有一個大花盆，裡面種著一株不知名的植物，根系非常深⋯⋯我看了看，覺察到花盆的底部好像有什麼東西，隱約探出了一角，我想往下看看，卻感覺不對勁，像是有什麼東西被壓在下面的。
　　在花盆旁邊的地上，我看到了一張白色的紙，翻看後是撕下來的日記，內容為：2014年7月9日。

　　這個瘋子，他殺人了嗎？我不敢想，我要問他，究竟怎麼回事！

　　「時間到了。」
　　我聽到殯儀在身旁的通知，便跟著他離開了房頂。他讓我重新戴上眼罩，回到了車上，不允許任何人交談⋯⋯` },
  'V2-SOIL': { name:'大樹旁泥土', act:'第二幕·別墅', content:`【大樹旁泥土】\n\n泥土明顯被挖過又填回，質地鬆軟，和周圍不同。\n\n樹旁有一個小木牌，上面寫著：「守護我們的家。」\n\n氣味有些異常……\n\n📌 主持人提示：阿花的身體埋於大樹下方，面部朝上，她的願望是永遠守護這個家。` },
  'V2-NEWS': { name:'臥室報紙', act:'第二幕·別墅', content:`【臥室報紙】\n\n一張舊報紙，頭版有個失蹤案的報導，照片中的醫生看起來很面熟……\n\n她的名字和照片出現在報紙上：她是一位醫生，同時也是一名攝影師。\n\n附近還有一本日記，幾頁被撕去了，留下的頁面裡有一句話：「我要記住每一件事，因為我不記得昨天了。」` },
  'V3-NEIGH': { name:'V3 · 鄰居的証詞', act:'第三幕·門市', content:`【鄰居的証詞】

我被殯儀帶到了門市邊的一家24小時超市內，跟隨在他的身後，我裹緊了衣服，晉州市的天愈發的冷了，加上小雨，透著心肺鑽來寒意。
　　抵達超市門口時，他對我說：「一會兒我將進去詢問，只有三分鐘的時間，聽清楚我的問題與答案。」
　　殯儀的眼睛直視著我，仿佛一座深不見底的水潭，冰冷、寂靜，誰也不知下面隱藏著怎樣可怕的怪物。
　　我迷茫地看著他，幾秒鐘後才明白他的意思，輕輕點了點頭。
　　殯儀領著我進入了24小時超市內，裡面是一位正在打瞌睡的售貨員，在殯儀與他的簡單溝通，並給了幾張鈔票後，開始了問答。

問：「你們隔壁門市內的女人失蹤了，你知道嗎？」
答：「是嗎？怪不得這幾天夜裡清靜多了，你們是不知道，平時的時候夜裡總能傳來鋼琴的彈奏聲。我曾去她家看過，大晚上的，裡面關著燈，聲音卻一直響著，不知道的還以為鬧鬼了呢！」

問：「你們距離的這麼近，平時見不到那個女人麼？」
答：「我是夜班，基本來了就在工作，哪裡有功夫注意其他人。若不是您說，我都不知道隔壁門市是個女人住的，想想更嚇人了，大約十天前她家晚上發出巨大的聲音，叫叫咣咣，像是裝修一樣。那時候我還想著，是不是把鋼琴給劈了，因為自那之後，就沒再聽到鋼琴的聲音，終於安靜了。」

問：「除此之外，還有什麼異樣麼？」
答：「嗯⋯⋯讓我想想⋯⋯我記憶中有一個男人偶爾會來，會有爭吵聲，好像是要錢什麼的，不知道那家門市的主人欠了誰的錢。您說隔壁住的是個女人，沒准是她找的男人也說不准，哈哈，誰知道呢。」

問：「她失蹤這件事，你們都不知道嗎？」
答：「不清楚，也沒人來管這件事，因為除了那個男人外，沒看到隔壁還有什麼人出入。」

殯儀的問話停止了，我就在一旁站著聽，其實也有問題想要詢問，但沒有開口的機會。
我隨著殯儀離開了24小時超市，在小雨和淡淡月光下，他讓我回到外面的車上，期間囑咐我，不要與其他六個人有何交談⋯⋯` },
  'V3-CALL': { name:'V3 · 電話錄音', act:'第三幕·門市', content:`【電話錄音】

我被殯儀帶到了車上，他手持著蠟燭，依舊是那幽幽的燭火，我們兩人四目相對，在火焰跳動中我卻感覺不到一點溫暖，有的只是深夜的寒冷，和殯儀那讓人極其不舒服的注視，仿佛是獵人在盯著自己的獵物。
　　他拿出手機，手指在上面輕輕的滑動著，對我說道：「你將會聽到的，是這間琴房的主人近期的幾段通話錄音，你要仔細聽，記住裡面的內容，獲取關鍵的信息。」
　　我望著他掌中的手機，嚥了口吐沫，聚精會神地豎起耳朵，生怕錯過裡面的內容。
　　殯儀見我已準備好，按下了手機屏幕，緊接著是一段嘈雜的電流聲，滋啦滋啦，隨後是第一段錄音。

男：「是阿燕老師嗎？」
女：「是我，請問您是？」
男：「我是上周跟您預約的，我家女兒的鋼琴又出現問題了，請問您什麼時候過來？」
女：「我想起來了，我今天下午過去怎麼樣？」
男：「那麻煩老師了。」
女：「百和超市東五十步對嗎？」
男：「是的。」

滋啦——滋啦——滋啦——
第二段錄音。
男：「您好，您的快遞到了，我還是給您送進屋子吧，小心被偷。」
女：「沒關係，裡面是琴弦，還有一些小工具，不會有人偷的。」
男：「那好，我給您放在門口了。」
女：「謝謝你啊。」

滋啦——滋啦——滋啦——
第三段錄音。
男：「你在不在家裡！」
女：「咱嗎，你不要再來找我了，我沒有錢了。」
男：「你個賤皮子，非得我上去打你，你才知道拿錢是嗎！告訴你，別忘了，你這樣的廢物以後都要誰來照顧！」
女：「我不用你管，我有辦法治好⋯⋯」
男：「你給我等著！把錢準備好！他娘的，沒錢打死你！」

殯儀點了下手機，裡面的錄音停止。
我驚駭地望著眼前的殯儀，耳邊還迴蕩著剛剛在錄音中聽到的對話，不禁有些毛骨悚然⋯⋯
殯儀關閉手機，問道：「你都聽清楚了？」
我猶豫著點點頭，道：「聽清楚了。」
殯儀打開車門，說：「好，那你在這裡等著，不要與其他人交談。」
隨後我就坐在這裡，一直沒有和其他上車的人說過話，仔細地回想著錄音裡的每一句⋯⋯` },
  'V3-BRO': { name:'V3 · 哥哥的証詞', act:'第三幕·門市', content:`【哥哥的証詞】

我被殯儀帶到了車輛內，隨後他在車外撥通了一個電話，不知與裡面的人說了什麼，待他拉開車門後，對我說道：「電話那頭是這棟門市主人的哥哥，只有三分鐘的時間，聽清楚問題與答案。」
　　殯儀坐到我對面的車座上，與我面對面，他的眼神變得陰冷，凝視著我，讓我不禁有一種墜入寒淵的感覺。
　　「有什麼事快點問吧，一會兒我家婆娘回來，就沒法說了。」對面傳來一個中年男人的聲音。
　　殯儀絲毫沒有慌亂，開始了他的問題。

問：「你妹妹失蹤是什麼時候的事？」
答：「嗯⋯⋯一個多星期沒見到她了。」

問：「她失蹤的時候，你有沒有察覺到什麼怪異的事？」
答：「平時我們聯繫的就比較少，本來燕子是跟我們一起住的，我那婆娘嫌棄她，兩個人總是爭吵，最後還是把她趕了出去。好在爹娘去世前留了點錢，她便自己開了個門市。你問怪事兒⋯⋯倒是沒有⋯⋯哎對了，一個星期前我去過她的琴房，當時是家那邊的老鄉郵來了她愛吃的糕點，我偷偷地想給她送去一些。
可那天她沒有在琴房，我妹妹出門也不會很久的，我便在琴房裡等她，也想著和她說說話，可等到晚上也沒有回來，我就離開了。」

問：「你一個人一直在琴房內等她？等到晚上？」
答：「害！當天去的時候是中午，因為前一晚打牌熬了一整夜，等她的時候困了，便在她琴房的沙發上睡了一覺，那一覺睡得很死，醒來時就是晚上了。」

問：「期間有沒有聽到什麼動靜？或者有沒有什麼事發生？」
答：「你這個人，我都說睡得很死了！她的琴房，空氣乾燥的很，我醒來的時候鼻子都流血了⋯⋯我家婆娘打了好多個電話，我見燕子還沒回來，就趕忙回去了。」

問：「你妹妹失蹤，你難道不著急麼？」
答：「當哥的能不急麼？她不在，我輸的錢⋯⋯嘆嗒，我婆娘好像回來了，不說了不說了。」

對面掛斷了電話，殯儀關閉手機，問道：「你都聽清楚了？」
我猶豫著點點頭，道：「差不多。」
殯儀打開車門，說：「好，那你在這裡等著，不要與其他人交談。」
隨後我就坐在這裡，一直沒有和其他上車的人說過話，仔細地回想著剛剛電話裡的每一句，似乎⋯⋯哪裡有點不對勁⋯⋯` },
  'V3-2FLIV': { name:'V3 · 二樓客廳', act:'第三幕·門市', content:`【二樓客廳】

夜風淒涼，殯儀遞給我一副純黑色的眼罩，我心懷忐忑地將它戴在頭上，瞬間黑暗遮蔽了我的視野，未知的恐懼漸漸刺進心裡，使得我每一步都小心翼翼。
　　我感覺到自己跨入了門檻，我嗅到一股腐臭的氣息，慢慢挪動著腳步，屋內的溫度比外面還要寒冷，濕漉漉的冷氣透過皮膚毛孔亂竄著。

　　在我進入房間約走了二十幾步後，耳畔聽到了殯儀的聲音：「前面是木質的樓梯，注意腳下。」

　　聽到他的話，我將全部精力集中在腳下，果然感覺到腳前撞到了什麼堅硬的物體，隨後他冰冷的手臂搭上了我的胳膊，我艱難地一步一步地邁上樓梯。
　　殯儀領我走到了二樓，在我面前推開了一扇門，對我說道：「這裡是客廳，你只有五分鐘的時間，記住你看到的一切。」
　　「砰！」
　　門被關上了，只剩下我一人在這裡。

　　我摘下眼罩，殯儀的手裡不知何時多了一根蠟燭，白色的，在黑暗的環境中，蠟燭所散發的微弱光芒便是我唯一能夠看清事物的幫手。
　　我環顧四周，這是二樓的客廳，房間不大。有沙發、茶几、書架，以及角落裡一台看起來很舊的電視機。
　　書架上擺放著大量的黑膠唱片，整齊地插在格子裡，每一張都用紙袋套著，上面用工整的字跡標注了曲目與演奏者的名字。
　　茶几上放著一個茶杯，裡面有乾涸的茶漬，旁邊擺著一副墨鏡——鏡片是深黑色的，鏡架似乎被反復擦拭過，油亮光滑。
　　沙發的扶手上掛著一條白色的盲杖。
　　牆上沒有任何照片，也沒有任何裝飾畫。

　　「時間到了。」
　　殯儀的身影出現在門外，隨後便關上了燈，我再次陷入黑暗之中。
　　借著外面的月光，我將蠟燭遞還給他。隨後他示意我重新戴上眼罩，隨他離開了房子，回到外面的車上，期間沒有讓我與其他六個人有任何交談⋯⋯` },
  'V3-2FKIT': { name:'V3 · 二樓廚房', act:'第三幕·門市', content:`【二樓廚房】

夜風淒涼，殯儀遞給我一副純黑色的眼罩，我看了看他，心懷忐忑地將眼罩戴在頭上，瞬間黑暗遮蔽了我的視野，未知的恐懼漸漸刺進心裡，使得我每一步都小心翼翼。
　　我感覺到自己跨入了門檻，鼻孔內嗅到一股腐臭的氣息，慢慢挪動著腳步，屋內的溫度比外面還要寒冷，濕漉漉的冷氣透過皮膚毛孔亂竄著。

　　在我進入房間約走了二十八步後，耳畔聽到了殯儀的聲音：「前面是木質的樓梯，注意腳下。」
　　聽到他的話，我將全部精力集中在腳下，果然感覺到腳前撞到了什麼堅硬的物體，隨後他冰冷的手臂搭上了我的胳膊，我艱難地一步一步地邁上樓梯。
　　與此同時，我鼻孔內鑽入的腐臭氣息愈來愈濃，好似是什麼食物壞掉了，讓我感到不適。
　　樓梯到了最頂層，因為不知道腳下的情況，我還是狠狠地絆了一個踉蹌，幸好殯儀在旁扶住了我。我有些惱怒，但還是隨著他繼續地向前走，很快我伸向前方的手摸到了一扇門。
　　「這裡是廚房，請進吧。」
　　門開了，我走進去終於可以摘下這該死的眼罩，當視野恢復後，卻發現依然是一片漆黑，沒有燈光。
　　「啪。」
　　殯儀手中的火機亮起淡淡的火苗，接著他點燃了手中的一只白蠟，微弱的光芒將屋子照亮一點點，他將白蠟遞給我。這不由得讓我感到忌諱，因為白蠟是為死人準備的，我拿著蠟燭，總有些毛骨悚然的感覺。
　　「你只有五分鐘的時間，記住你看到的一切。」他絲毫沒有理會我，說完，便獨自出門將我關在這狹小的房間內。

　　我手持蠟燭照照四周，仔細地查看著，額頭冒著汗，與我想到的相反，廚房格外的整潔，除了無人居住而留下的一層灰塵外，其擺放位置、潔淨程度，近乎是一塵不染，能夠想象到這家的主人是個極其愛乾淨的人。
　　幽幽的燭火下，我看到鍋、碗、瓢、盆，形狀各異，還有洗潔精、幾塊不同形狀的毛巾，以及一些奇特形狀的筷子、刀、叉⋯⋯醬油、醋、料酒等物品的瓶子樣式不同，都保存的很乾淨。
　　廚房內的設施是齊全的，炒鍋也能看出常常使用的痕跡，牆壁上掛著的幾把刀上面，都用不同的膠帶纏繞住了刀把的位置，膠帶上粘著一些裝飾物，有星星形狀的，月牙形狀的，還有花瓣形狀的⋯⋯
　　我伸手將其中一把刀拿了下來，將刀把握在手裡，裝飾物並不會有疼痛的感覺。
　　我在房間內看到了燈的開關，嘗試著按下，卻發現燈是壞的，難怪殯儀只給了我一根蠟燭。

　　就在這時，我聽到了外面門被打開的聲音。
　　「時間到了。」
　　殯儀的身影出現在廚房外，我隨著他離開了這個房間，並將蠟燭遞還給他。隨後他示意我重新戴上眼罩，隨他離開了房子，回到外面的車上，期間沒有讓我與其他六個人有任何交談⋯⋯` },
  'V3-PIANO': { name:'V3 · 一樓琴房', act:'第三幕·門市', content:`【一樓琴房】

夜風淒涼，殯儀遞給我一副純黑色的眼罩，我心懷忐忑地將它戴在頭上，瞬間黑暗遮蔽了我的視野，未知的恐懼漸漸刺進心裡，使得我每一步都小心翼翼。
　　我感覺到自己跨入了門檻，我嗅到一股腐臭的氣息，我挪動著腳步，屋內的溫度比外面還要寒冷，濕漉漉的冷氣透過皮膚毛孔亂竄著。

　　我有點恐懼，隨即便聽到殯儀那冰冷冰冷的聲音。
　　「摘下你的眼罩吧。」

　　我深呼吸一口氣，將眼罩拿了下來，殯儀的手裡不知何時多了一個蠟燭，白色的。在黑暗的環境中，蠟燭所散發的微弱光芒，便是我唯一能夠看清事物的幫手⋯⋯殯儀將白蠟遞到我的手中，我握著蠟燭，這時殯儀轉頭便走了出去，臨出門時對我說道：「不許進工具間，也不許去二樓，你只有五分鐘的時間，記住你看到的所有。」
　　「我⋯⋯」
　　「砰！」
　　還沒等我說話，門被關上了，只剩下我一人在這黑漆漆的房間內。可我一進房間，心裡就有一種不受控制、毛骨悚然的感覺，似乎在這間房子內，有什麼正在死死地盯著我！

　　我借著微弱的燭光，看到門口的旁邊擺放著一個雨傘架，裡面插著兩把雨傘，其中的一個傘葉和傘蓋都消失了，只剩下光禿禿的傘骨，看起來似乎是一個獨居。傘架的旁邊是鞋架，上面只有一雙粉色的女士拖鞋。
　　同時，我發現在門口有一個燈光的開關，我嘗試著按了一下，屋子瞬間亮了起來！我驚訝地回頭望向門口，門是關閉的，而殯儀也沒有進來阻攔我。我安心的將蠟燭吹滅，頭頂的燈光卻忽然開始閃爍，似乎是燈絲老化了。

　　我看向房間內的場景，在一樓的正中央擺放著一架鋼琴，通體為白色，非常漂亮，顯然價值不菲。我上前去，在忽明忽暗的燈光下，嘗試著按了一個琴鍵，發出了清脆悅耳的聲音，這棟門市的主人應是彈鋼琴的好手，只是沒有看到琴譜，鋼琴上方的譜架上是空盪盪的。

　　鋼琴的不遠處是一張灰色的大沙發，能夠容納一個人躺在上面休息，在沙發上看到一些散落的名片，上面寫著：徐老師，電話：XXXXXXXXXX，地址：晉州市通達街道XXXXX號。
　　我拿起一張名片，端詳著嘗試坐到沙發上去，軟軟的，頭頂是那盞閃著光的水晶吊燈，燈很漂亮，有幾十根燈柱，只是因為老化的緣故，有兩根已經沒有了光亮。

　　它閃爍著，似乎隨時都要暗下去，我不敢耽擱，從沙發上起來繼續在房間裡徘徊，最裡面便是殯儀提到的工具間，我沒有進去。一樓琴房的牆壁上掛著幾幅相框，但是裡面並沒有照片⋯⋯

　　「時間到了。」
　　殯儀的身影出現在門外，隨後便關閉了燈光，我再次陷入黑暗之中。
　　借著外面的月光，我將蠟燭遞還給他。隨後他示意我重新戴上眼罩，隨他離開了房子，回到外面的車上，期間沒有讓我與其他六個人有任何交談⋯⋯` },
  'V3-TOOL': { name:'V3 · 一樓工具間', act:'第三幕·門市', content:`【一樓工具間】

　　她披著頭髮，穿著一身慘白色的衣服，露出上半身，站在角落裡，正看著我！
　　「啊——」
　　我驚叫出聲，握著蠟燭的手微微發抖，試探著喊道：「你是誰？」
　　她沒有回答，我的背脊發涼，頭皮發麻。
　　我咽了口吐沫，在這個房子外還有殯儀和其他六個人，想到這兒給自己壯了壯膽子，走向前去⋯⋯
　　隨著距離拉近，我意識到那並不是個人，而是一張插在櫃子後的巨大畫像，上面只有黑白兩種顏色，畫了一個披散頭髮、戴著墨鏡的女人。黑白二色被畫勾勒的簡單而恐懼，在微弱燭火的映射下，仿佛隨時都要活過來。
　　燭光搖擺，我的鼻孔內鑽入一絲絲奇怪的味道，畫中的她異常消瘦，不知為什麼我卻總覺得她是活的⋯⋯
　　她的畫因為來在櫃子後，有點看不清楚。
　　畫中只有她一個人。
　　我有心上前將畫抽出來，就在這時，我聽到身後的門緩緩打開了。

　　殯儀的身影出現在工具間外，我沒有多想，趕忙脫離這個狹窄的空間，將蠟燭遞還給他。隨後他示意我重新戴上眼罩，隨他離開了房子，回到外面的車上，期間沒有讓我與其他六個人有任何交談⋯⋯` },
  'V4-PROP': { name:'V4 · 道具間', act:'第四幕·戲院', content:`【道具間】

  'V4-AUD': { name:'V4 · 觀眾席', act:'第四幕·戲院', content:`【觀眾席】

  'V4-ROOM': { name:'V4 · 更衣室', act:'第四幕·戲院', content:`【更衣室】

　　在兩排衣服的後面有一個立式的柜子，上面貼著一個人名，人偶戲主角：秦冬。
　　我想這應該就是我們要找到的名字吧。
　　我嘗試著打開柜子的門，上面的鎖頭是開著的，柜子裡面卻只攥了一件沾滿灰塵的衣服。我將衣服拿出來抖了抖，借著燈光仔細地觀看，衣服上面沾染許多泥土還有血跡，更令我注意到的是，這件衣服與更衣室裡的其他衣服都不一樣，他不是演出的戲服，而是生活中穿著的衣服。
　　我將衣服仔細地檢查了一番，放了回去，確保沒有什麼其他的東西。
　　在衣服的旁邊的牆上有一面落地的大鏡子，我站在鏡子前照了照自己，昏暗的燈光將我的臉照得有些扭曲。而我這時注意到鏡子下方的明暗角落裡，在光明照不到的地方藏著一個垃圾桶。
　　我蹲下身，垃圾桶內堆滿了垃圾，顯然很久都沒有收拾過了。我在垃圾桶裡翻找了一翻，看到了一些已經被燒燬的黑色碎紙，我將一些碎紙拿起來卻感覺到不對勁，它的觸感並不是紙，通過材質來看的話，似乎是一些照片，被燒燬後扭曲變形的樣子。
　　照片？
　　我的腦子裡好像想到了什麼，在垃圾桶內還有一張白紙，看邊角是撕下來的日記，內容為：2014年7月1日。

　　我們又吵架了，他總是想回到家裡去，因為這件事我們已經爭吵了無數次，搞的整個劇組都不安寧，只希望爭吵是短暫的，千萬不要影響我的演出才好。

　　「時間到了」我的身後傳來了殯儀的聲音。
　　我感到有些混亂，轉過身向門口走去。
　　「戴上眼罩吧」殯儀對我說道。
　　我隨著他出了劇場回到了車上，和前兩個地點一樣，他不讓我與任何人交談，但我也在期待著其他人得到的將會是什麼樣的信息。
　　外面的雨好像停了，這一夜什麼時候才會過去？` },
  'V4-WATCH': { name:'V4 · 打更老頭', act:'第四幕·戲院', content:`【打更老頭】

當我們離開時，殯儀帶著我等到了外面，其他人也都站在外面等待著，我望著他，不知道這一次他會帶來什麼樣的事情。
　　可沒想到，他竟是從身邊的老人身上接過了一個東西——是一份口述錄音的文字記錄。
　　殯儀將紙遞給了我，問道：「記住了？」
　　殯儀的眼睛回看著我，說道：「仔細看，你們需要記著這些信息。」

　　打更老頭的口述記錄如下——

　　「打更演員？對，那個打更演員我知道。他來這裡，就是打更。他特別的，跟我們其他人不一樣，你可以這樣理解——他只有一個人，但他好像一個人能夠頂兩個人用，為他特別準備了一個位置。

　　打更人，他每天來的時間都是固定的，跟其他人不同，他每天跑來跑去，是最多的，好多好多問題，到他那裡，又多了些。

　　打更人長什麼樣，是的，我看過，他是面相這時長，此外他不是太高，但他不是跟人交大人來往，可以跟到他了解個人的情況，你多些了，如果不多了，他不是跟人了解。

　　打更人是的。直到天亮的時候，還往裡走了一遭，我也沒有看見就是這裡出的那個，反正後來還有其他他人出來，我也不知然後還看到幾次以上的照面，只是看到了。」

　　殯儀打開車門，說：「好，那你在這裡等著，不要與其他人交談。」
　　我先一個人，靜靜地坐在車裡，說不出這滋味⋯⋯` },
  'V4-ACT': { name:'V4 · 對戲演員', act:'第四幕·戲院', content:`【對戲演員】

當我們離開時，殯儀帶著我到了外面，其他人也都在外面等著，我望著他，不知道這一次他會帶來什麼事情。
　　殯儀遞給我一份文字記錄，今天的內容為一份在日記夾縫中發現的日記頁：2014年7月10日。

　　這個瘋子，他殺人了嗎？我不敢想象，我要問問他，究竟怎麼回事！

　　以及對戲演員的口述記錄——

問：「你了解秦冬這個演員嗎？」
答：「了解，我認識他很久了。」

　　「他是個很特別的人，跟我們其他演員不一樣，你可以這樣理解——他就像兩個人，一個人在台上，另一個人在腦子裡。他非常有才華，只是他不太跟人交往，可以說他跟我了解個人的情況，你多些了，如果不多了，他不是跟人了解。

　　對戲演員，他是的，他就像是有兩個自己，一直在扮演兩個不同的角色，但是這兩個角色，日漸演來成了和他自己真實存在的不同的個人，總是說起，可以聽到他對各種人的個人反應，只是反應上的照面，只是看到了。

　　這個人不同，一秒也不想跟另一個自己在一起，似乎一直在對抗一個內部的人，但他又必須讓他存在。只是看到了。」

　　殯儀打開車門，說：「好，那你在這裡等著，不要與其他人交談。」
　　我先一個人，靜靜地坐在車裡，說不出這滋味⋯⋯` },
  'V4-MKP': { name:'V4 · 化妝間', act:'第四幕·戲院', content:`【化妝間】

殯儀為我帶上了眼罩，有了前兩個地點的經歷，我的心臟跳動的更加迅速，我不知道即將看到什麼，卻能夠想象到在這劇院內，隱藏著驚人的事情。
　　我開始好奇，死者是誰？他又經歷了什麼？
　　與前兩個地點不同，我能夠透過眼罩的縫隙感受到點點光亮。
　　至少，不用在黑暗中摸索了。

　　當殯儀的腳步停止時，他的聲音在耳畔響起：「摘下眼罩吧。」
　　我迅速地做出反應，將眼罩拿下，看到的是一扇黃褐色的門，有些老舊，在門上面貼著幾個黑色的字：化妝間。
　　「你這次只有三分鐘的時間。」殯儀說著，伸手替我打開了門。
　　我猶豫著推開了化妝間的門，大量的梳妝台映入眼簾，能夠看到裡面燈光昏黃，這是化妝間，每一個梳妝台都帶有標記，標注著演員的名字。
　　我往化妝台的旁邊走去，仔細翻看每一個台面，沒有發現什麼特別的東西。
　　在靠近化妝間角落的地方，有一個梳妝台上面貼著一個人名：秦冬。
　　我俯下身，在梳妝台上一看，在台面上撿了一張白紙，看邊角是撕下來的日記，內容為：2014年7月3日。

　　這個瘋子，他殺人了嗎？我不敢想，我要問問他，究竟怎麼回事！我一秒不想和他在一起了，我再也無法忍受他了，一分，一秒都不想和他在一起了！可能我要最受歡迎了，這也是最受歡迎了，「不成，不成，」可能我要再最受歡迎一些，有什麼差異，也不小，他不可能一輩子在這裡貌。我再也不知所向了！

　　就在這時，我走向地的門打開了。
　　我感到有些混亂，轉過身向門口走去。離別之際，我看到地上躺著一具人偶，他的身上掛著一件特別醒目的裝飾。
　　「戴上眼罩吧」殯儀對我說道。
　　我隨著他出了劇場回到了車上，和前兩個地點一樣，他不讓我與任何人交談，但我也在期待著其他人得到的將會是什麼樣的信息。
　　外面的雨好像停了，這一夜什麼時候才會過去？` },
  'V4-STAGE': { name:'V4 · 劇場舞台', act:'第四幕·戲院', content:`【劇場舞台】

殯儀為我帶上了眼罩，有了前兩個地點的經歷，我的心臟跳動的更加迅速，我不知道即將看到什麼，卻能夠想象到在這劇院內，隱藏著驚人的事情。
　　我開始好奇，死者是誰？他又經歷了什麼？
　　殯儀拉扯著我的衣服，與前兩個地點不同，我能夠透過眼罩的縫隙感受到點點光亮。
　　至少，不用在黑暗中摸索了。

　　「摘下眼罩吧。」
　　當殯儀對我說出這句話時，我緩緩地摘下眼罩，眼前是一個空曠的場景。
　　「你只有三分鐘的時間。」殯儀冷聲道，隨後轉身離去。
　　入眼的是一片光亮，在我面前出現的是一座舞台，密密麻麻的人偶被吊掛在天棚上，垂下來距離我的頭頂不過半米。
　　只是頭頂的燈是紅色的，使得整個空間顯得詭異而虛幻，不仔細看，如同十幾具活生生的屍體被吊死在頭頂，讓人心生懼惶。
　　每一具人偶都穿著各式各樣的衣服，哪怕知道他們是人偶，卻依然有被死死盯著的感覺，可明明我可以看到他們的臉上是木頭的，連五官都沒有雕刻。
　　我仔細地觀察著每一具人偶，很好奇他們這種布置，是演出什麼樣的戲？我從未見過如此恐怖的舞台劇。
　　正在我好奇時，我注意到舞台上吊掛的人偶中，有一具顯得有些奇怪，那具人偶的身體是傾斜的，呈一個斜著的角度，和其他筆直的人偶掛在一起，有些突兀，是繩子吊掛的方向問題嗎？
　　在那具人偶下方的地板上，我注意到一張白色的紙，拿起來仔細看了看，似乎是不知道從哪撕下來的日記，內容為：2014年7月9日。

　　這個瘋子，他殺人了嗎？我不敢想象，我要問問他，究竟怎麼回事！

　　舞台的前方是一塊大紅色的幕布，遮擋住了舞台和觀眾席之間，我想要偷偷扒開幕布向觀眾席看去。
　　「咳咳！」
　　我聽到了一個咳嗽的聲音，嚇的我身體一顫，我回頭，看到殯儀在舞台的角落裡盯著我。
　　似乎是我的舉動惹怒了他，他向我走來。
　　「時間到了。」
　　我望著他攔住了推，射燈將他的身體也映成紅色。
　　我轉過身向他的方向走去，離別之際，我回頭看了眼吊在舞台上的十幾具人偶，總覺得哪裡有點不太對勁。
　　「戴上眼罩吧」殯儀對我說道。
　　我無奈的隨著他出了劇場回到了車上，和前兩個地點一樣，他不讓我與任何人交談，但我也在期待著其他人得到的將會是什麼樣的信息。
　　外面的雨好像停了，這一夜什麼時候才會過去？` },
  'A01-LOW': { name:'雍九的日記殘頁', act:'第五幕·私人', content:`【雍九的日記殘頁】\n日期：2014年7月21日\n\n我站在墳墓前，那個黑色的坑洞就像是要吞噬一切的怪獸。\n\n我將他最喜歡的那本《昨日救贖》放在棺材內，希望他在另一個世界裡還能繼續讀它。\n\n沈先生，對不起。\n\n你說我是你唯一的朋友，但最後的代價卻是由你來承擔。\n我知道你不是真的死了。\n但你必須死去，才能讓計劃繼續。` },
  'A02-SAC': { name:'《昨日救贖2》卡牌規則', act:'第五幕·私人', content:`【《昨日救贖2》卡牌規則】\n\n獲得卡牌的人只有兩種方式脫離——\n死亡，或者交換。\n\n卡牌持有者必須找到另一個具有相同罪孽之人，方可完成交換。\n若無法交換，審判者將代為執行死亡。\n\n十二天之內，審判者必須收回十二張卡牌。\n每一張卡牌，對應一種人性的劣根——\n而那個人，必須為自己的罪孽付出代價。\n\n計時開始。` },
  'A03-EXE': { name:'雍九的日記殘頁', act:'第五幕·私人', content:`【雍九的日記殘頁】\n日期：2013年6月2日\n\n十張卡牌，十種病態。\n我真是天才。\n\nPBA症狀——笑臉綜合征\n自閉症——無法與外界正常溝通\n性癮——無法控制的肉體渴望\n抑鬱症——那個渴望死亡的靈魂\n反社會人格——強者哲學的守護者\n社交恐懼症——活在世界邊緣的影子\n臆想症——活在夢與現實之間\n……還有更多\n\n這個計劃需要一個可靠的審判者。\n我要招募他。\n讓他來完成我無法親手完成的事。` },
  'A04-FAC': { name:'雍九的日記殘頁', act:'第五幕·私人', content:`【雍九的日記殘頁】\n日期：2014年7月21日\n\n我為他們七個人準備好了一份禮物。\n那是一個微型炸彈。\n\n他們以為今晚是葬禮，是送別。\n他們不知道，這才是開始。\n\n我要在今夜，將十一張卡牌全部收回。\n還有一張——那張背叛我的人手中的卡牌。\n\n計劃已經完美。\n今夜，結束。` },
  'A05-HUN': { name:'《昨日救贖2》書籍介紹', act:'第五幕·私人', content:`【《昨日救贖2》書籍介紹】\n作者：雍九\n\n本書共包含十二張卡牌，對應人性中十二種最深層的劣根性。\n每一位卡牌持有者，都曾在生命中的某個時刻觸犯過這項罪孽。\n\n審判者，是十二張卡牌中地位最高的存在。\n他的使命，是找到並消滅其他十一位卡牌持有者。\n以罪之名，行審判之實。\n\n當十二張卡牌全數歸位，儀式便告完成。\n那一刻，所謂的救贖，才真正降臨。` },
  'A06-WAL': { name:'沈先生電腦上的聊天記錄', act:'第五幕·私人', content:`【沈先生電腦上的聊天記錄】\n日期：2014年7月17日\n\n雍九：我只是想告訴你，你現在可以選擇——繼續和我合作，或者接受今晚的後果。\n\n沈先生：我沒有辦法繼續假裝了，雍九。我看過你準備的東西，我知道你要做什麼。\n\n雍九：你知道有什麼用呢？你的手上也不乾淨。\n\n沈先生：我知道。但我不能讓更多人因此而死。\n\n雍九：那就只有你死了。\n\n沈先生：我不怕。只要他們能活著。\n\n（對話記錄於此結束）` },
  'A07-DRE': { name:'沈先生寫給雍九的信', act:'第五幕·私人', content:`【沈先生寫給雍九的信】\n\n雍九，\n\n你曾經問我，為什麼我願意一開始就幫助你。\n\n我告訴你我的故事：\n我的繼父是一個惡魔。他在我年幼時就開始虐待我，最後被捕入獄。\n那段日子，我沒有朋友，沒有家人，只有一本書陪著我——《昨日救贖》。\n\n那本書是你寫的。\n它讓我相信，這個世界上的惡是可以被清除的。\n\n所以，當你找到我的時候，我選擇相信你。\n我以為我們做的事情是對的。\n\n但是現在我知道——\n你的方式，是錯的。\n以罪殺罪，最終只剩下罪。\n\n雍九，我沒有辦法和你走到最後了。\n\n沈先生` },
  // B系列 — 第二本第一幕線索（沈先生U盤文件）
  'B01-POL': { name:'警方報告', act:'第二本·壹', content:`【警方報告】\n日期：2014年7月22日\n\n事件：爆炸案\n地點：蒼語山墓園，苦語山附近\n\n報告摘要：\n2014年7月22日凌晨，接獲市民報案，稱蒼語山墓園附近發生爆炸，火光沖天。\n\n現場搜查發現殘留物及一具遺骸，初步鑒定死亡時間約為7月17日至18日之間。\n\n遺骸身份尚未確認。現場發現多枚疑似手工製作的起爆裝置碎片。\n\n調查仍在進行中。` },
  'B02-FILE': { name:'精神病院簡歷', act:'第二本·壹', content:`【精神病院簡歷】\n\n姓名：鄧治\n性別：男\n年齡：40歲（入院時）\n診斷：反社會人格障礙\n入院日期：2011年5月\n主治醫生：小花（化名）\n\n病歷摘要：\n患者有長期暴力行為記錄，對他人缺乏共情能力。\n童年創傷史，曾遭繼父長期虐待。\n入院後情緒波動明顯，對主治醫師表現出極度的依賴與敵意並存的複雜情感。\n\n備注：該患者已于2013年4月逃院，目前下落不明。` },
  'B03-INFO': { name:'警方信息', act:'第二本·壹', content:`【警方信息】\n日期：2013年4月\n\n事件：精神病院逃人事件\n地點：苦語山精神病院\n\n事發經過：\n2013年4月，苦語山精神病院發生一名患者逃院事件。\n逃院患者身份：鄧治，反社會人格障礙患者。\n\n逃院前，患者對主治醫生實施了性侵犯。\n醫生受到嚴重心理創傷，事後申請了長期休假，離開了該醫院。\n\n鄧治的下落至今未查明。警方持續追緝中。` },
  'B04-JOUR': { name:'記者口述', act:'第二本·壹', content:`【記者口述】\n日期：2013年5月\n\n關於苦語山精神病院火災的目擊口述：\n\n「那是2013年5月的事。那場火來得太突然了，一夜之間，苦語山精神病院幾乎全毀。\n\n據說有數百名病人在火災中罹難，但官方的說法一直含糊其辭。\n\n我在火場附近，親眼看到一個陌生男子站在山頭，看著火勢蔓延，一動不動。\n\n那個人的眼神……我這輩子都忘不了。那不是恐懼，那是某種說不清楚的……滿足感。\n\n後來我才知道，那場火燒死的，包括了讓那個院逃跑的病人的前任受害者。」` },

// ============================================================
// STATE
// ============================================================
let sessionId = '';
let myChar = null;
let myName = '';
let myUnlocked = [];
let gmState = {};

function playerKey() { return sessionId + '_' + (myChar ? myChar.id : ''); }

// ---- GM State ----
let lastBroadcastCount = 0;

function applyGMState(newState) {
  const prevBroadcasts = (gmState.broadcasts || []).length;
  gmState = newState;
  updatePhaseIndicator();
  if (window._script) renderAct(currentAct);
  updateBook2Tab();

  const newBroadcasts = (gmState.broadcasts || []).length;
  if (newBroadcasts > prevBroadcasts && prevBroadcasts > 0) {
    const latest = gmState.broadcasts[0];
    showToast('📢 ' + (latest ? latest.msg.substring(0, 40) : '主持人有新通知'));
    // Add red dot to broadcast tab
    const broadcastBtn = document.querySelector('.ptab-btn[onclick*="broadcast"]');
    if (broadcastBtn && !broadcastBtn.classList.contains('active')) {
      broadcastBtn.setAttribute('data-badge', '●');
      broadcastBtn.style.position = 'relative';
      if (!document.getElementById('broadcastDot')) {
        const dot = document.createElement('span');
        dot.id = 'broadcastDot';
        dot.style.cssText = 'position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#e05555';
        broadcastBtn.appendChild(dot);
      }
    }
  }

  if (document.getElementById('ptab-broadcast') && document.getElementById('ptab-broadcast').classList.contains('active')) {
    renderBroadcast();
  }
}

function subscribeToGMState() {
  if (!sessionId) return;
  _supa.from('game_state').select('state').eq('id', sessionId).single()
    .then(({ data }) => { if (data && data.state) applyGMState(data.state); });
  _supa.channel('gm_state_player_' + sessionId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'game_state', filter: `id=eq.${sessionId}` },
      payload => { if (payload.new && payload.new.state) applyGMState(payload.new.state); })
    .subscribe();
}

// ---- Player State ----
async function savePlayerState() {
  if (!sessionId || !myChar) return;
  const row = { id: playerKey(), session_id: sessionId, char_id: myChar.id, player_name: myName, unlocked_codes: myUnlocked, updated_at: new Date().toISOString() };
  try { await _supa.from('player_state').upsert(row); } catch(e) { console.warn('player state save error', e); }
  // also localStorage backup
  localStorage.setItem('ps_' + playerKey(), JSON.stringify(row));
}

async function loadPlayerState() {
  if (!sessionId || !myChar) return false;
  try {
    const { data } = await _supa.from('player_state').select('*').eq('id', playerKey()).single();
    if (data) {
      myName = data.player_name || '';
      myUnlocked = Array.isArray(data.unlocked_codes) ? data.unlocked_codes : [];
      return true;
    }
  } catch(e) {}
  // fallback to localStorage
  try {
    const local = JSON.parse(localStorage.getItem('ps_' + playerKey()) || 'null');
    if (local) { myName = local.player_name || ''; myUnlocked = local.unlocked_codes || []; return true; }
  } catch(e) {}
  return false;
}

// ============================================================
// SESSION JOIN
// ============================================================
async function joinSession() {
  const code = document.getElementById('sessionCodeInput').value.trim().toUpperCase();
  const errDiv = document.getElementById('sessionError');
  errDiv.textContent = '';
  if (!code) { errDiv.textContent = '請輸入場次代碼'; return; }

  sessionId = code;
  localStorage.setItem('player_session_id', sessionId);
  showIntroScreen();
}

function showIntroScreen() {
  document.getElementById('sessionScreen').style.display = 'none';
  document.getElementById('introScreen').style.display = 'block';
  document.getElementById('introSessionBadge').textContent = '場次：' + sessionId + ' — 選擇你的角色';
  renderIntro();
}

// ============================================================
// INTRO
// ============================================================
function renderIntro() {
  const grid = document.getElementById('charSelectGrid');
  grid.innerHTML = CHARACTERS.map(c => `
    <div class="char-select-card" id="csc-${c.id}" onclick="selectChar('${c.id}')">
      <div class="csc-num">${c.id}</div>
      <div class="csc-name">${c.name}</div>
      <div class="csc-desc">${c.desc}</div>
    </div>
  `).join('');
}

function selectChar(id) {
  document.querySelectorAll('.char-select-card').forEach(c => c.classList.remove('selected'));
  const card = document.getElementById('csc-' + id);
  if (card) card.classList.add('selected');
  myChar = CHARACTERS.find(c => c.id === id);
  localStorage.setItem('player_char_id', id);
  checkEnterBtn();
}

function checkEnterBtn() {
  const name = document.getElementById('playerNameInput').value.trim();
  document.getElementById('enterBtn').disabled = !myChar || !name;
}

document.getElementById('playerNameInput').addEventListener('input', checkEnterBtn);

async function enterGame() {
  myName = document.getElementById('playerNameInput').value.trim();
  if (!myChar || !myName) return;
  document.getElementById('enterBtn').disabled = true;
  document.getElementById('enterBtn').textContent = '連線中...';
  await savePlayerState();
  subscribeToGMState();
  showApp();
}

// ============================================================
// APP
// ============================================================
function showApp() {
  document.getElementById('sessionScreen').style.display = 'none';
  document.getElementById('introScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('myCharBadge').textContent = myChar.name + ' · ' + myName;
  renderMyChar();
  renderUnlockedClues();
  renderBroadcast();
  updatePhaseIndicator();
}

let currentAct = 0;
let currentBook2Section = 0;

function renderBook2(idx) {
  currentBook2Section = idx;
  const script = window._book2Script;
  if (!script) return;
  const section = script[idx];
  const unlocked = (gmState.unlocked || {})[section.lockCode];

  const nav = document.getElementById('book2Nav');
  if (nav) {
    nav.innerHTML = script.map((s, i) => {
      const sUnlocked = (gmState.unlocked || {})[s.lockCode];
      return `<button class="act-nav-btn ${i === idx ? 'active' : ''} ${!sUnlocked ? '' : ''}"
        onclick="renderBook2(${i})" ${!sUnlocked ? 'style="opacity:0.5"' : ''}>${s.title}</button>`;
    }).join('');
  }

  const div = document.getElementById('book2Content');
  if (!div) return;

  if (!unlocked) {
    div.innerHTML = `
      <div style="text-align:center;padding:32px 16px;color:var(--muted)">
        <div style="font-size:2rem;margin-bottom:8px">🔒</div>
        <p style="font-size:0.85rem">等待主持人開放此節</p>
        <p style="font-size:0.75rem;margin-top:6px;color:#555">代碼：${section.lockCode}</p>
      </div>
    `;
    return;
  }

  const isChat = section.title.startsWith('聊天記錄');
  div.innerHTML = `
    <div class="script-reader">
      <div class="script-act-title">${section.title}</div>
      <div class="script-body" style="${isChat ? 'font-family:monospace;font-size:0.82rem;line-height:2;background:var(--surface2);border-radius:8px;padding:14px' : ''}">${section.content.replace(/\n/g, '<br>')}</div>
      <div style="display:flex;justify-content:space-between;margin-top:16px">
        ${idx > 0 ? `<button class="act-nav-inline" onclick="renderBook2(${idx-1})">← 上一節</button>` : '<span></span>'}
        ${idx < script.length - 1 ? `<button class="act-nav-inline" onclick="renderBook2(${idx+1})">下一節 →</button>` : '<span style="color:var(--muted);font-size:0.8rem">（第二本完）</span>'}
      </div>
    </div>
  `;
}

function updateBook2Tab() {
  const tab = document.getElementById('book2Tab');
  if (!tab) return;
  const unlocked = (gmState.unlocked || {})['UNLOCK-BOOK2'];
  tab.style.display = unlocked ? 'block' : 'none';
  if (unlocked && window._book2Script) {
    renderBook2(currentBook2Section);
  }
}

function renderMyChar() {
  const c = myChar;
  const letter = CHAR_LETTER[c.id] || { wish: '', hint: c.desc };
  const script = getScript(c.name, letter);

  document.getElementById('myCharInfo').innerHTML = `
    <div class="char-info-name">${c.id} · ${c.name}</div>
    <span class="char-info-tag">${myName}</span>
    <div style="font-size:0.78rem;color:var(--muted);margin-top:6px;margin-bottom:14px;font-style:italic">${letter.hint}</div>
    <div class="act-nav" id="actNav"></div>
    <div id="actContent"></div>
  `;

  window._script = script;
  window._book2Script = getBook2Script(c.id, c.name);
  renderAct(0);

  document.getElementById('questGuide').style.display = 'none';
}

function renderAct(idx) {
  currentAct = idx;
  const script = window._script;
  const act = script[idx];

  // Nav buttons
  const nav = document.getElementById('actNav');
  if (nav) {
    nav.innerHTML = script.map((a, i) =>
      `<button class="act-nav-btn ${i === idx ? 'active' : ''}" onclick="renderAct(${i})">${a.title.split('·')[0].trim()}</button>`
    ).join('');
  }

  const contentDiv = document.getElementById('actContent');
  if (!contentDiv) return;

  if (act.locked) {
    const unlocked = (gmState.unlocked || {})[act.lockCode] || myUnlocked.includes(act.lockCode);
    if (!unlocked) {
      contentDiv.innerHTML = `
        <div style="text-align:center;padding:32px 16px;color:var(--muted)">
          <div style="font-size:2rem;margin-bottom:8px">🔒</div>
          <p style="font-size:0.85rem">等待主持人開放此幕</p>
          <p style="font-size:0.75rem;margin-top:6px;color:#555">代碼：${act.lockCode}</p>
        </div>
      `;
      return;
    }
  }

  contentDiv.innerHTML = `
    <div class="script-reader">
      <div class="script-act-title">${act.title}</div>
      <div class="script-body">${act.content.replace(/\n/g, '<br>')}</div>
      <div style="display:flex;justify-content:space-between;margin-top:16px">
        ${idx > 0 ? `<button class="act-nav-inline" onclick="renderAct(${idx-1})">← 上一幕</button>` : '<span></span>'}
        ${idx < script.length - 1 ? `<button class="act-nav-inline" onclick="renderAct(${idx+1})">下一幕 →</button>` : '<span style="color:var(--muted);font-size:0.8rem">（劇本完）</span>'}
      </div>
    </div>
  `;
}

function updatePhaseIndicator() {
  const PHASE_NAMES = ['入場+選角','開場微演繹','第一幕：信件','第二幕：別墅','第三幕：門市','第四幕：戲院','第五幕：沈先生家','結尾'];
  const idx = gmState.currentPhase || 0;
  document.getElementById('phaseIndicator').textContent = '當前：' + (PHASE_NAMES[idx] || '等待開始');
}

// ============================================================
// CLUES
// ============================================================
async function unlockClue() {
  const input = document.getElementById('codeInput');
  const code = input.value.trim().toUpperCase();
  const errDiv = document.getElementById('codeError');
  errDiv.textContent = '';
  if (!code) return;

  // Check GM has unlocked it
  const gmUnlocked = gmState.unlocked || {};

  if (CLUE_DATA[code]) {
    if (!gmUnlocked[code] && !gmUnlocked[code.toLowerCase()]) {
      // Still allow player to unlock if they have the code (GM may have given verbally)
      // But show a warning
    }
    if (myUnlocked.includes(code)) {
      errDiv.textContent = '這個線索已經解鎖了！';
      return;
    }
    myUnlocked.push(code);
    await savePlayerState();
    input.value = '';
    renderUnlockedClues();
    showToast('✅ 線索解鎖：' + CLUE_DATA[code].name);
  } else {
    errDiv.textContent = '❌ 代碼不正確，請確認後重新輸入';
    showToast('代碼無效', true);
  }
}

function renderUnlockedClues() {
  const div = document.getElementById('unlockedClues');
  if (!myUnlocked.length) {
    div.innerHTML = `
      <div class="empty-state">
        <div class="icon">🔒</div>
        <p>尚未解鎖任何線索<br>向主持人索取代碼，輸入後即可查看</p>
      </div>
    `;
    return;
  }
  div.innerHTML = [...myUnlocked].reverse().map(code => {
    const c = CLUE_DATA[code];
    if (!c) return '';
    return `
      <div class="clue-item">
        <div class="clue-item-header">
          <span class="clue-item-name">📄 ${c.name}</span>
          <span class="clue-item-code">${code}</span>
        </div>
        <div style="font-size:0.72rem;color:var(--muted);margin-bottom:6px">${c.act}</div>
        <div class="clue-item-body">${c.content}</div>
      </div>
    `;
  }).join('');
}

// ============================================================
// BROADCAST
// ============================================================
function renderBroadcast() {
  // Clear red dot when opening broadcast tab
  const dot = document.getElementById('broadcastDot');
  if (dot) dot.remove();
  const list = document.getElementById('broadcastList');
  const broadcasts = gmState.broadcasts || [];
  if (!broadcasts.length) {
    list.innerHTML = '<div class="no-broadcast">🔇 尚無主持人通知</div>';
    return;
  }
  list.innerHTML = broadcasts.map(b => `
    <div class="broadcast-item">
      <div class="broadcast-time">${b.time}</div>
      ${b.msg}
    </div>
  `).join('');
}

// ============================================================
// TABS
// ============================================================
function switchPTab(id) {
  document.querySelectorAll('.ptab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.ptab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('ptab-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
  if (id === 'broadcast') renderBroadcast();
  if (id === 'clues') renderUnlockedClues();
  updatePhaseIndicator();
}

// ============================================================
// URL PARAMS
// ============================================================
function checkURLParams() {
  const params = new URLSearchParams(window.location.search);
  const charId = params.get('char');
  if (charId) selectChar(charId);
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// ============================================================
// INIT
// ============================================================
async function init() {
  // Try to restore session
  const savedSession = localStorage.getItem('player_session_id');
  const savedCharId = localStorage.getItem('player_char_id');

  if (savedSession && savedCharId) {
    sessionId = savedSession;
    myChar = CHARACTERS.find(c => c.id === savedCharId);
    if (myChar) {
      const restored = await loadPlayerState();
      if (restored && myName) {
        subscribeToGMState();
        showApp();
        return;
      }
    }
  }

  // No saved session — show session join screen
  if (savedSession) {
    sessionId = savedSession;
    showIntroScreen();
  } else {
    document.getElementById('sessionScreen').style.display = 'block';
  }
  checkURLParams();
}

init();
</script>
</body>
</html>
