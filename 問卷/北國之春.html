<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>布魯斯酒館登記表 · 北國之春</title>
    <style>
        :root {
            --veil-top: rgba(0, 0, 0, .35);
            --backdrop-opacity: .55;
            --shadow: rgba(0, 0, 0, .55);
            --error: #ff8a7a;
            --on-accent: #14100c;
            --field: rgba(255, 255, 255, .06);
            --bg: #0e2a21;
            --text: #eee9d6;
            --title: #f6f1de;
            --muted: rgba(238, 233, 214, .62);
            --accent: #e8dfb8;
            --line: rgba(238, 233, 214, .2);
            --chip: rgba(238, 233, 214, .1);
            --card: rgba(13, 40, 31, .82);
        }
        * { box-sizing: border-box; }
        html { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
            background: var(--bg);
            font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* 海報本身當整頁的霧面背景，跟劇本主頁同一套視覺 */
        .backdrop {
            position: fixed;
            inset: -40px;
            z-index: 0;
            pointer-events: none;
            background: url("../img/劇本/北國之春/北國之春劇本殺海報1.webp") center / cover no-repeat;
            filter: blur(38px) saturate(1.15);
            opacity: var(--backdrop-opacity);
            transform: scale(1.1);
        }
        .backdrop::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--veil-top) 0%, var(--bg) 78%);
        }
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 16px 72px;
        }

        /* ── 主視覺 ───────────────────────────── */
        .hero {
            display: grid;
            gap: 26px;
            align-items: center;
            margin-bottom: 30px;
        }
        .poster {
            justify-self: center;
            width: min(78vw, 340px);
            margin: 0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 24px 60px var(--shadow), 0 0 0 1px var(--line);
            animation: rise .9s cubic-bezier(.2, .8, .2, 1) both;
        }
        .poster img { display: block; width: 100%; height: auto; }
        @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
        .intro { text-align: center; animation: rise .9s .12s cubic-bezier(.2, .8, .2, 1) both; }
        .eyebrow {
            display: inline-block;
            padding: 5px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: .78rem;
            letter-spacing: .35em;
            color: var(--accent);
        }
        .intro h1 {
            margin: 14px 0 4px;
            font-size: clamp(2rem, 9vw, 3rem);
            line-height: 1.15;
            letter-spacing: .12em;
            color: var(--title);
        }
        .form-title { margin: 0; font-size: 1.05rem; letter-spacing: .2em; color: var(--muted); }
        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
        }
        .chips li {
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--chip);
            font-size: .85rem;
            color: var(--text);
        }
        .lead {
            margin: 20px auto 0;
            max-width: 34em;
            line-height: 1.9;
            color: var(--text);
        }
        .lead:empty { display: none; }

        /* ── 登場角色 ─────────────────────────── */
        .cast { margin: 0 0 30px; }
        .cast h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 14px;
            font-size: .95rem;
            letter-spacing: .3em;
            color: var(--accent);
        }
        .cast h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
        .cast ul {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 92px;
            gap: 12px;
            margin: 0;
            padding: 2px 2px 10px;
            list-style: none;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
        }
        .ch { scroll-snap-align: start; text-align: center; }
        .ch img, .ch-ph {
            display: grid;
            place-items: center;
            width: 92px;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            object-position: top;
            border-radius: 10px;
            background: var(--chip);
            box-shadow: 0 0 0 1px var(--line);
            font-size: 1.6rem;
            color: var(--accent);
            cursor: zoom-in;
        }
        .ch-name { display: block; margin-top: 6px; font-size: .8rem; line-height: 1.3; color: var(--muted); }
        .note { margin: -6px 0 22px; text-align: center; font-size: .85rem; color: var(--muted); }

        @media (min-width: 860px) {
            .hero { grid-template-columns: 340px 1fr; gap: 44px; }
            .intro { text-align: left; }
            .chips { justify-content: flex-start; }
            .lead { margin-left: 0; }
            .cast ul { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); overflow: visible; }
            .ch img, .ch-ph { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) { .poster, .intro { animation: none; } }

        /* ── 問卷 ─────────────────────────────── */
        .survey-box { max-width: 680px; margin: 0 auto; }
        #survey {
            --sv-scheme: dark;
            --sv-accent: var(--accent);
            --sv-on-accent: var(--on-accent);
            --sv-text: var(--text);
            --sv-muted: var(--muted);
            --sv-card: var(--card);
            --sv-border: var(--line);
            --sv-field: var(--field);
            --sv-error: var(--error);
        }

    </style>
</head>
<body>
    <div class="backdrop" aria-hidden="true"></div>

    <main class="wrap container">
        <header class="hero">
            <figure class="poster">
                <img src="../img/劇本/北國之春/北國之春劇本殺海報1.webp" alt="北國之春 海報" fetchpriority="high" decoding="async">
            </figure>
            <div class="intro">
                <span class="eyebrow">角色分配問卷</span>
                <h1>北國之春</h1>
                <p class="form-title">布魯斯酒館登記表</p>
                <ul class="chips">
                    <li>👥 3男3女</li>
                    <li>⏰ 4小時</li>
                    <li>#歡樂</li>
                    <li>#推理</li>
                    <li>#新手</li>
                </ul>
                <p class="lead">遠道而來的客人呀~<br>歡迎參加《北國之春》劇本殺<br>本次遊戲背景設定於1980年代的冷戰蘇聯，人數6人（3男/3女），全程約4小時。<br>請依照個人興趣與直覺，依序填寫下方問卷，我會在布魯斯酒館靜待您的到來。</p>
            </div>
        </header>

        <section class="cast" aria-label="登場角色">
            <h2>登場角色</h2>
            <ul>
                <li class="ch"><img src="../img/劇本/北國之春/縮圖/娜塔莉.webp" data-full="../img/劇本/北國之春/娜塔莉.webp" alt="娜塔莉" loading="lazy" decoding="async"><span class="ch-name">娜塔莉</span></li>
                <li class="ch"><img src="../img/劇本/北國之春/維克多.webp" data-full="../img/劇本/北國之春/維克多.webp" alt="維克多" loading="lazy" decoding="async"><span class="ch-name">維克多</span></li>
                <li class="ch"><img src="../img/劇本/北國之春/縮圖/尤里希.webp" data-full="../img/劇本/北國之春/尤里希.webp" alt="尤里希" loading="lazy" decoding="async"><span class="ch-name">尤里希</span></li>
                <li class="ch"><img src="../img/劇本/北國之春/縮圖/索菲亞.webp" data-full="../img/劇本/北國之春/索菲亞.webp" alt="索菲亞" loading="lazy" decoding="async"><span class="ch-name">索菲亞</span></li>
                <li class="ch"><img src="../img/劇本/北國之春/縮圖/康斯坦丁.webp" data-full="../img/劇本/北國之春/康斯坦丁.webp" alt="康斯坦丁" loading="lazy" decoding="async"><span class="ch-name">康斯坦丁</span></li>
                <li class="ch"><img src="../img/劇本/北國之春/縮圖/鮑里斯.webp" data-full="../img/劇本/北國之春/鮑里斯.webp" alt="鮑里斯" loading="lazy" decoding="async"><span class="ch-name">鮑里斯</span></li>
            </ul>
        </section>
        <p class="note">依直覺作答就好，角色由主持人綜合大家的回覆分配 🎭</p>

        <div class="survey-box">
            <div id="survey"></div>
        </div>
    </main>

    <script>
    window.SURVEY = {
        script: '北國之春',
        submitText: '登記・推門入座',
        questions: [
            {"type": "text", "title": "該如何稱呼您", "desc": "社群軟體上的名稱", "required": true},
            {"type": "radio", "title": "性別", "required": true, "options": ["男生", "女生", "我是男生，如果必要我願意反串", "我是女生，如果必要我願意反串"]},
            {"type": "date", "title": "遊玩日期", "required": true},
            {"type": "checkbox", "title": "如果今天工作一整天，回家後發現家裡遭小偷了，而且小偷好像躲在櫃子後面，你會", "required": true, "options": ["拔出腰上的長刀，怒氣沖沖大喊死小偷給我出來~", "我的天啊，關上門默默報警，把他堵在家裡~", "哈哈哈哈哈哈我怎麼可能會發現啦我那麼呆", "先默默觀察，也許對方不是小偷", "開什麼玩笑，我超級會講話，一定是直接跟他說理，感化他"], "other": true},
            {"type": "checkbox", "title": "事後他被警察逮捕了，就是一個小偷，你會", "required": true, "options": ["哈哈哈哈看到了吧全世界，我幫社會大眾抓到壞人啦~", "嚇鼠@@沒有一個禮拜我是緩不過來的", "什麼大風大浪我沒見過 ? 不就一個小偷而已", "欸欸你知道嗎~前幾天我家遭小偷欸...!@#$%"], "other": true},
            {"type": "checkbox", "title": "關於自己的一些標籤", "required": true, "options": ["沉穩", "直接", "獨立", "溫柔", "責任感", "歡樂", "老練", "可靠", "善於社交", "善推理", "善於觀察"], "other": true},
            {"type": "checkbox", "title": "許願池", "desc": "單純給大家許願而已 ✧◝(⁰▿⁰)◜✧  不一定會納入角色分配的參考", "required": true, "options": ["我想拿兇手", "我要找人吵架", "我要當C位", "我要瘋狂推理", "我要當隱藏的boss"], "other": true},
            {"type": "text", "title": "留言板", "desc": "如果當天有任何需要協助的事情都歡迎和我說~"}
        ],
        done: {
            title: '🍸 已為您留好座位',
            text: '期待當天的劇本~',
            back: { href: '../6人/北國之春.html', text: '← 回到《北國之春》劇本介紹' },
            link: { href: 'https://www.instagram.com/larp_starfish', text: '📷 追蹤海星 IG' }
        }
    };
    </script>
    <script src="../survey.js?v=20261006e"></script>
    <script src="../lightbox.js?v=20261006"></script>
    <script src="../fx3d.js?v=20260714" data-fx="snow" data-tint="#e8f0e4" data-density="0.8"></script>
</body>
</html>
