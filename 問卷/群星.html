<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>群星登入太空計畫 · 群星</title>
    <style>
        :root {
            --veil-top: rgba(0, 0, 0, .35);
            --backdrop-opacity: .55;
            --shadow: rgba(0, 0, 0, .55);
            --error: #ff8a7a;
            --on-accent: #fff8ee;
            --field: rgba(255, 255, 255, .06);
            --bg: #17141a;
            --text: #f1e6d2;
            --title: #f6e9cf;
            --muted: rgba(241, 230, 210, .62);
            --accent: #e0573b;
            --line: rgba(241, 230, 210, .18);
            --chip: rgba(241, 230, 210, .09);
            --card: rgba(30, 25, 32, .8);
        }
        * { box-sizing: border-box; }
        html { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
            background: var(--bg);
            font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
            -webkit-font-smoothing: antialiased;
        }
        /* 海報本身當整頁的霧面背景，跟劇本主頁同一套視覺 */
        .backdrop {
            position: fixed;
            inset: -40px;
            z-index: 0;
            pointer-events: none;
            background: url("../img/劇本/群星/群星劇本殺海報1.webp") center / cover no-repeat;
            filter: blur(38px) saturate(1.15);
            opacity: var(--backdrop-opacity);
            transform: scale(1.1);
        }
        .backdrop::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--veil-top) 0%, var(--bg) 78%);
        }
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 16px 72px;
        }

        /* ── 主視覺 ───────────────────────────── */
        .hero {
            display: grid;
            gap: 26px;
            align-items: center;
            margin-bottom: 30px;
        }
        .poster {
            justify-self: center;
            width: min(78vw, 340px);
            margin: 0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 24px 60px var(--shadow), 0 0 0 1px var(--line);
            animation: rise .9s cubic-bezier(.2, .8, .2, 1) both;
        }
        .poster img { display: block; width: 100%; height: auto; }
        @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
        .intro { text-align: center; animation: rise .9s .12s cubic-bezier(.2, .8, .2, 1) both; }
        .eyebrow {
            display: inline-block;
            padding: 5px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: .78rem;
            letter-spacing: .35em;
            color: var(--accent);
        }
        .intro h1 {
            margin: 14px 0 4px;
            font-size: clamp(2rem, 9vw, 3rem);
            line-height: 1.15;
            letter-spacing: .12em;
            color: var(--title);
        }
        .form-title { margin: 0; font-size: 1.05rem; letter-spacing: .2em; color: var(--muted); }
        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
        }
        .chips li {
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--chip);
            font-size: .85rem;
            color: var(--text);
        }
        .lead {
            margin: 20px auto 0;
            max-width: 34em;
            line-height: 1.9;
            color: var(--text);
        }
        .lead:empty { display: none; }

        /* ── 登場角色 ─────────────────────────── */
        .cast { margin: 0 0 30px; }
        .cast h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 14px;
            font-size: .95rem;
            letter-spacing: .3em;
            color: var(--accent);
        }
        .cast h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
        .cast ul {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 92px;
            gap: 12px;
            margin: 0;
            padding: 2px 2px 10px;
            list-style: none;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
        }
        .ch { scroll-snap-align: start; text-align: center; }
        .ch img, .ch-ph {
            display: grid;
            place-items: center;
            width: 92px;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            object-position: top;
            border-radius: 10px;
            background: var(--chip);
            box-shadow: 0 0 0 1px var(--line);
            font-size: 1.6rem;
            color: var(--accent);
            cursor: zoom-in;
        }
        .ch-name { display: block; margin-top: 6px; font-size: .8rem; line-height: 1.3; color: var(--muted); }
        .note { margin: -6px 0 22px; text-align: center; font-size: .85rem; color: var(--muted); }

        @media (min-width: 860px) {
            .hero { grid-template-columns: 340px 1fr; gap: 44px; }
            .intro { text-align: left; }
            .chips { justify-content: flex-start; }
            .lead { margin-left: 0; }
            .cast ul { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); overflow: visible; }
            .ch img, .ch-ph { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) { .poster, .intro { animation: none; } }

        /* ── 問卷 ─────────────────────────────── */
        .survey-box { max-width: 680px; margin: 0 auto; }
        #survey {
            --sv-scheme: dark;
            --sv-accent: var(--accent);
            --sv-on-accent: var(--on-accent);
            --sv-text: var(--text);
            --sv-muted: var(--muted);
            --sv-card: var(--card);
            --sv-border: var(--line);
            --sv-field: var(--field);
            --sv-error: var(--error);
        }

    </style>
</head>
<body>
    <div class="backdrop" aria-hidden="true"></div>

    <main class="wrap container">
        <header class="hero">
            <figure class="poster">
                <img src="../img/劇本/群星/群星劇本殺海報1.webp" alt="群星 海報" fetchpriority="high" decoding="async">
            </figure>
            <div class="intro">
                <span class="eyebrow">角色分配問卷</span>
                <h1>群星</h1>
                <p class="form-title">群星登入太空計畫</p>
                <ul class="chips">
                    <li>👥 3男3女</li>
                    <li>⏰ 5小時</li>
                    <li>#機制</li>
                    <li>#情感</li>
                    <li>#沉浸</li>
                </ul>
                <p class="lead">歡迎各位宇航員參與本次群星計畫，在計畫開始前，請簡單的介紹一下自己吧</p>
            </div>
        </header>

        <section class="cast" aria-label="登場角色">
            <h2>登場角色</h2>
            <ul>
                <li class="ch"><img src="../img/劇本/群星/縮圖/張北斗.webp" data-full="../img/劇本/群星/張北斗.webp" alt="張北斗" loading="lazy" decoding="async"><span class="ch-name">張北斗</span></li>
                <li class="ch"><img src="../img/劇本/群星/縮圖/達莉婭.webp" data-full="../img/劇本/群星/達莉婭.webp" alt="達莉婭" loading="lazy" decoding="async"><span class="ch-name">達莉婭</span></li>
                <li class="ch"><img src="../img/劇本/群星/縮圖/索菲亞.webp" data-full="../img/劇本/群星/索菲亞.webp" alt="索菲亞" loading="lazy" decoding="async"><span class="ch-name">索菲亞</span></li>
                <li class="ch"><img src="../img/劇本/群星/縮圖/貝斯.webp" data-full="../img/劇本/群星/貝斯.webp" alt="貝斯" loading="lazy" decoding="async"><span class="ch-name">貝斯</span></li>
                <li class="ch"><img src="../img/劇本/群星/縮圖/馬斯克.webp" data-full="../img/劇本/群星/馬斯克.webp" alt="馬斯克" loading="lazy" decoding="async"><span class="ch-name">馬斯克</span></li>
                <li class="ch"><img src="../img/劇本/群星/縮圖/伊萬.webp" data-full="../img/劇本/群星/伊萬.webp" alt="伊萬" loading="lazy" decoding="async"><span class="ch-name">伊萬</span></li>
            </ul>
        </section>
        <p class="note">依直覺作答就好，角色由主持人綜合大家的回覆分配 🎭</p>

        <div class="survey-box">
            <div id="survey"></div>
        </div>
    </main>

    <script>
    window.SURVEY = {
        script: '群星',
        submitText: '確認登記・點火升空',
        questions: [
            {"type": "text", "title": "您在社群裡的名字是？", "required": true},
            {"type": "radio", "title": "您的性別是？", "required": true, "options": ["男", "女", "男，可接受玩女角", "女，可接受玩男角"]},
            {"type": "text", "title": "群星計劃中有您的另一半嗎？如有請留下他/她在社群裡的名字"},
            {"type": "radio", "title": "您玩過多少劇本呢？", "required": true, "options": ["1~5本", "6~20本", "20本以上", "這是第一次"]},
            {"type": "info", "desc": "請想像以下情境\n你是一位即將前往遠方的旅人，遠方有著你的夢想和渴望，有著新奇與有趣的事物，你對遠方一直充滿著幻想。而就在出發的前一天晚上，你在自己的家中安然休息，並且作了一個十分甜美的夢。"},
            {"type": "radio", "title": "你希望夢境內容是關於家鄉還是遠方", "required": true, "options": ["家鄉", "遠方"]},
            {"type": "info", "desc": "第二天從美夢中醒來，你將伴隨著和煦的微風和清晨出發。一路上鳥語花香，景色優美，讓你感到心曠神怡。而就在你因為沿途風景而流連忘返的時候，你突然發現自己有些迷路。因此你打算抬頭看看天空"},
            {"type": "radio", "title": "當你抬頭看向天空時，你希望看到的是太陽還是星空呢", "required": true, "options": ["太陽", "星空"]},
            {"type": "info", "desc": "你終於找到了方向，經過一路艱難險阻、跋山涉水後，你抵達了此行的目的地，你達了你一直以來的夢想與渴望。就在這時，你收到了來自家鄉寄來的信件"},
            {"type": "radio", "title": "當你拿著這封信時，你希望這是家人寄來的還是戀人寄來的呢?", "required": true, "options": ["家人", "戀人"]},
            {"type": "text", "title": "期待當天見面^^有任何特殊需求需要我幫您服務的嗎？"}
        ],
        done: {
            title: '🚀 登記完成',
            text: '預祝計畫順利，群星永遠閃耀！'
        }
    };
    </script>
    <script src="../survey.js?v=20261006c"></script>
    <script src="../lightbox.js?v=20261006"></script>
    <script src="../fx3d.js?v=20260714" data-fx="stars" data-tint="#f3dfb8"></script>
</body>
</html>
