<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>客棧旅客登記表 · 那一束月光</title>
    <style>
        :root {
            --veil-top: rgba(0, 0, 0, .35);
            --backdrop-opacity: .55;
            --shadow: rgba(0, 0, 0, .55);
            --error: #ff8a7a;
            --on-accent: #14100c;
            --field: rgba(255, 255, 255, .06);
            --bg: #06163a;
            --text: #e6eeff;
            --title: #ffffff;
            --muted: rgba(230, 238, 255, .62);
            --accent: #bcd4ff;
            --line: rgba(188, 212, 255, .22);
            --chip: rgba(188, 212, 255, .1);
            --card: rgba(8, 26, 66, .8);
        }
        * { box-sizing: border-box; }
        html { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
            background: var(--bg);
            font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* 海報本身當整頁的霧面背景，跟劇本主頁同一套視覺 */
        .backdrop {
            position: fixed;
            inset: -40px;
            z-index: 0;
            pointer-events: none;
            background: url("../img/劇本/那一束月光/那一束月光海報1.webp") center / cover no-repeat;
            filter: blur(38px) saturate(1.15);
            opacity: var(--backdrop-opacity);
            transform: scale(1.1);
        }
        .backdrop::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--veil-top) 0%, var(--bg) 78%);
        }
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 16px 72px;
        }

        /* ── 主視覺 ───────────────────────────── */
        .hero {
            display: grid;
            gap: 26px;
            align-items: center;
            margin-bottom: 30px;
        }
        .poster {
            justify-self: center;
            width: min(78vw, 340px);
            margin: 0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 24px 60px var(--shadow), 0 0 0 1px var(--line);
            animation: rise .9s cubic-bezier(.2, .8, .2, 1) both;
        }
        .poster img { display: block; width: 100%; height: auto; }
        @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
        .intro { text-align: center; animation: rise .9s .12s cubic-bezier(.2, .8, .2, 1) both; }
        .eyebrow {
            display: inline-block;
            padding: 5px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: .78rem;
            letter-spacing: .35em;
            color: var(--accent);
        }
        .intro h1 {
            margin: 14px 0 4px;
            font-size: clamp(2rem, 9vw, 3rem);
            line-height: 1.15;
            letter-spacing: .12em;
            color: var(--title);
        }
        .form-title { margin: 0; font-size: 1.05rem; letter-spacing: .2em; color: var(--muted); }
        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
        }
        .chips li {
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--chip);
            font-size: .85rem;
            color: var(--text);
        }
        .lead {
            margin: 20px auto 0;
            max-width: 34em;
            line-height: 1.9;
            color: var(--text);
        }
        .lead:empty { display: none; }

        /* ── 登場角色 ─────────────────────────── */
        .cast { margin: 0 0 30px; }
        .cast h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 14px;
            font-size: .95rem;
            letter-spacing: .3em;
            color: var(--accent);
        }
        .cast h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
        .cast ul {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 92px;
            gap: 12px;
            margin: 0;
            padding: 2px 2px 10px;
            list-style: none;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
        }
        .ch { scroll-snap-align: start; text-align: center; }
        .ch img, .ch-ph {
            display: grid;
            place-items: center;
            width: 92px;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            object-position: top;
            border-radius: 10px;
            background: var(--chip);
            box-shadow: 0 0 0 1px var(--line);
            font-size: 1.6rem;
            color: var(--accent);
            cursor: zoom-in;
        }
        .ch-name { display: block; margin-top: 6px; font-size: .8rem; line-height: 1.3; color: var(--muted); }
        .note { margin: -6px 0 22px; text-align: center; font-size: .85rem; color: var(--muted); }

        @media (min-width: 860px) {
            .hero { grid-template-columns: 340px 1fr; gap: 44px; }
            .intro { text-align: left; }
            .chips { justify-content: flex-start; }
            .lead { margin-left: 0; }
            .cast ul { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); overflow: visible; }
            .ch img, .ch-ph { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) { .poster, .intro { animation: none; } }

        /* ── 問卷 ─────────────────────────────── */
        .survey-box { max-width: 680px; margin: 0 auto; }
        #survey {
            --sv-scheme: dark;
            --sv-accent: var(--accent);
            --sv-on-accent: var(--on-accent);
            --sv-text: var(--text);
            --sv-muted: var(--muted);
            --sv-card: var(--card);
            --sv-border: var(--line);
            --sv-field: var(--field);
            --sv-error: var(--error);
        }

    </style>
</head>
<body>
    <div class="backdrop" aria-hidden="true"></div>

    <main class="wrap container">
        <header class="hero">
            <figure class="poster">
                <img src="../img/劇本/那一束月光/那一束月光海報1.webp" alt="那一束月光 海報" fetchpriority="high" decoding="async">
            </figure>
            <div class="intro">
                <span class="eyebrow">角色分配問卷</span>
                <h1>那一束月光</h1>
                <p class="form-title">客棧旅客登記表</p>
                <ul class="chips">
                    <li>👥 3男3女</li>
                    <li>⏰ 5小時</li>
                    <li>#現代</li>
                    <li>#情感</li>
                    <li>#歡樂</li>
                </ul>
                <p class="lead">客官，聊聊您自己吧😎</p>
            </div>
        </header>

        <section class="cast" aria-label="登場角色">
            <h2>登場角色</h2>
            <ul>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/姜安心.webp" data-full="../img/劇本/那一束月光/姜安心.webp" alt="姜安心" loading="lazy" decoding="async"><span class="ch-name">姜安心</span></li>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/宋一嶼.webp" data-full="../img/劇本/那一束月光/宋一嶼.webp" alt="宋一嶼" loading="lazy" decoding="async"><span class="ch-name">宋一嶼</span></li>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/吳倩尹.webp" data-full="../img/劇本/那一束月光/吳倩尹.webp" alt="吳倩尹" loading="lazy" decoding="async"><span class="ch-name">吳倩尹</span></li>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/顧諾.webp" data-full="../img/劇本/那一束月光/顧諾.webp" alt="顧諾" loading="lazy" decoding="async"><span class="ch-name">顧諾</span></li>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/林沐陽.webp" data-full="../img/劇本/那一束月光/林沐陽.webp" alt="林沐陽" loading="lazy" decoding="async"><span class="ch-name">林沐陽</span></li>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/許知言.webp" data-full="../img/劇本/那一束月光/許知言.webp" alt="許知言" loading="lazy" decoding="async"><span class="ch-name">許知言</span></li>
            </ul>
        </section>
        <p class="note">依直覺作答就好，角色由主持人綜合大家的回覆分配 🎭</p>

        <div class="survey-box">
            <div id="survey"></div>
        </div>
    </main>

    <script>
    window.SURVEY = {
        script: '那一束月光',
        submitText: '辦理入住',
        questions: [
            {"type": "text", "title": "您在社群(DC/LINE)裡的名字是？", "required": true},
            {"type": "radio", "title": "您的生理性別是？", "required": true, "options": ["男", "女", "男，可接受玩女角", "女，可接受玩男角"]},
            {"type": "text", "title": "一同入住的旅客中有您的另一半嗎？如有請留下他/她在LINE裡的名字"},
            {"type": "radio", "title": "您玩過多少劇本呢？", "required": true, "options": ["1~5本", "6~20本", "20本以上", "這是第一次"]},
            {"type": "radio", "title": "您抽中了七天六夜豪華遊輪之旅，並且可以帶一位旅伴出席，您會想找誰一起呢？", "required": true, "options": ["想找機會告白的曖昧對象", "辛辛苦苦養大我們的家人", "充滿革命情感的隔壁同事", "當我們垃圾桶的摯友閨蜜", "我想自己一個人享受旅行"], "other": true},
            {"type": "radio", "title": "您抵達了港口準備登船，此時在排隊人龍的最後方，有個人悠悠哉哉越過隊伍直接上船，您認為他/她可以插隊的原因是？", "required": true, "options": ["因為額外多付錢", "是個遲到的船員", "旅伴已經在船上", "其他人都看不到"], "other": true},
            {"type": "radio", "title": "順利上了船準備前往房間，您希望自己的房間可以離什麼設施最近？", "required": true, "options": ["甲板，隨時能去吹吹海風", "餐廳，我這個人不能餓到", "賭場，小賭怡情大賭刺激", "酒吧，誰不期待一場邂逅"], "other": true},
            {"type": "text", "title": "走著走著，您發現走廊上掛著一幅《諾亞方舟》，方舟上載著各式各樣的動物，如果要找一個最像您的動物，您覺得是？", "required": true},
            {"type": "text", "title": "有任何特殊需求需要我幫您服務的嗎？"}
        ],
        done: {
            title: '🌙 入住登記完成',
            text: '客官，我們當天見！'
        }
    };
    </script>
    <script src="../survey.js?v=20261006c"></script>
    <script src="../lightbox.js?v=20261006"></script>
    <script src="../fx3d.js?v=20260714" data-fx="fireflies" data-tint="#cfe0ff" data-density="0.8"></script>
</body>
</html>
