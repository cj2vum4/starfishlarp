<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>遊戲前問卷 · 那一束月光</title>
    <style>
        :root {
            --veil-top: rgba(0, 0, 0, .35);
            --backdrop-opacity: .55;
            --shadow: rgba(0, 0, 0, .55);
            --error: #ff8a7a;
            --on-accent: #14100c;
            --field: rgba(255, 255, 255, .06);
            --bg: #06163a;
            --text: #e6eeff;
            --title: #ffffff;
            --muted: rgba(230, 238, 255, .62);
            --accent: #bcd4ff;
            --line: rgba(188, 212, 255, .22);
            --chip: rgba(188, 212, 255, .1);
            --card: rgba(8, 26, 66, .8);
        }
        * { box-sizing: border-box; }
        html { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
            background: var(--bg);
            font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* 海報本身當整頁的霧面背景，跟劇本主頁同一套視覺 */
        .backdrop {
            position: fixed;
            inset: -40px;
            z-index: 0;
            pointer-events: none;
            background: url("../img/劇本/那一束月光/那一束月光海報1.webp") center / cover no-repeat;
            filter: blur(38px) saturate(1.15);
            opacity: var(--backdrop-opacity);
            transform: scale(1.1);
        }
        .backdrop::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--veil-top) 0%, var(--bg) 78%);
        }
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 16px 72px;
        }

        /* ── 主視覺 ───────────────────────────── */
        .hero {
            display: grid;
            gap: 26px;
            align-items: center;
            margin-bottom: 30px;
        }
        .poster {
            justify-self: center;
            width: min(78vw, 340px);
            margin: 0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 24px 60px var(--shadow), 0 0 0 1px var(--line);
            animation: rise .9s cubic-bezier(.2, .8, .2, 1) both;
        }
        .poster img { display: block; width: 100%; height: auto; }
        @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
        .intro { text-align: center; animation: rise .9s .12s cubic-bezier(.2, .8, .2, 1) both; }
        .eyebrow {
            display: inline-block;
            padding: 5px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: .78rem;
            letter-spacing: .35em;
            color: var(--accent);
        }
        .intro h1 {
            margin: 14px 0 4px;
            font-size: clamp(2rem, 9vw, 3rem);
            line-height: 1.15;
            letter-spacing: .12em;
            color: var(--title);
        }
        .form-title { margin: 0; font-size: 1.05rem; letter-spacing: .2em; color: var(--muted); }
        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
        }
        .chips li {
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--chip);
            font-size: .85rem;
            color: var(--text);
        }
        .lead {
            margin: 20px auto 0;
            max-width: 34em;
            line-height: 1.9;
            color: var(--text);
        }
        .lead:empty { display: none; }

        /* ── 登場角色 ─────────────────────────── */
        .cast { margin: 0 0 30px; }
        .cast h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 14px;
            font-size: .95rem;
            letter-spacing: .3em;
            color: var(--accent);
        }
        .cast h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
        .cast ul {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 92px;
            gap: 12px;
            margin: 0;
            padding: 2px 2px 10px;
            list-style: none;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
        }
        .ch { scroll-snap-align: start; text-align: center; }
        .ch img, .ch-ph {
            display: grid;
            place-items: center;
            width: 92px;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            object-position: top;
            border-radius: 10px;
            background: var(--chip);
            box-shadow: 0 0 0 1px var(--line);
            font-size: 1.6rem;
            color: var(--accent);
            cursor: zoom-in;
        }
        .ch-name { display: block; margin-top: 6px; font-size: .8rem; line-height: 1.3; color: var(--muted); }
        .note { margin: -6px 0 22px; text-align: center; font-size: .85rem; color: var(--muted); }

        @media (min-width: 860px) {
            .hero { grid-template-columns: 340px 1fr; gap: 44px; }
            .intro { text-align: left; }
            .chips { justify-content: flex-start; }
            .lead { margin-left: 0; }
            .cast ul { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); overflow: visible; }
            .ch img, .ch-ph { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) { .poster, .intro { animation: none; } }

        /* ── 問卷 ─────────────────────────────── */
        .survey-box { max-width: 680px; margin: 0 auto; }
        #survey {
            --sv-scheme: dark;
            --sv-accent: var(--accent);
            --sv-on-accent: var(--on-accent);
            --sv-text: var(--text);
            --sv-muted: var(--muted);
            --sv-card: var(--card);
            --sv-border: var(--line);
            --sv-field: var(--field);
            --sv-error: var(--error);
        }

    </style>
</head>
<body>
    <div class="backdrop" aria-hidden="true"></div>

    <main class="wrap container">
        <header class="hero">
            <figure class="poster">
                <img src="../img/劇本/那一束月光/那一束月光海報1.webp" alt="那一束月光 海報" fetchpriority="high" decoding="async">
            </figure>
            <div class="intro">
                <span class="eyebrow">角色分配問卷</span>
                <h1>那一束月光</h1>
                <p class="form-title">遊戲前問卷</p>
                <ul class="chips">
                    <li>👥 3男3女</li>
                    <li>⏰ 5小時</li>
                    <li>#現代</li>
                    <li>#情感</li>
                    <li>#歡樂</li>
                </ul>
                <p class="lead">遊戲開始前，請誠實填寫這份問卷<br>你的答案將幫助我們為你分配最適合的角色</p>
            </div>
        </header>

        <section class="cast" aria-label="登場角色">
            <h2>登場角色</h2>
            <ul>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/姜安心.webp" data-full="../img/劇本/那一束月光/姜安心.webp" alt="姜安心" loading="lazy" decoding="async"><span class="ch-name">姜安心</span></li>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/宋一嶼.webp" data-full="../img/劇本/那一束月光/宋一嶼.webp" alt="宋一嶼" loading="lazy" decoding="async"><span class="ch-name">宋一嶼</span></li>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/吳倩尹.webp" data-full="../img/劇本/那一束月光/吳倩尹.webp" alt="吳倩尹" loading="lazy" decoding="async"><span class="ch-name">吳倩尹</span></li>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/顧諾.webp" data-full="../img/劇本/那一束月光/顧諾.webp" alt="顧諾" loading="lazy" decoding="async"><span class="ch-name">顧諾</span></li>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/林沐陽.webp" data-full="../img/劇本/那一束月光/林沐陽.webp" alt="林沐陽" loading="lazy" decoding="async"><span class="ch-name">林沐陽</span></li>
                <li class="ch"><img src="../img/劇本/那一束月光/縮圖/許知言.webp" data-full="../img/劇本/那一束月光/許知言.webp" alt="許知言" loading="lazy" decoding="async"><span class="ch-name">許知言</span></li>
            </ul>
        </section>
        <p class="note">依直覺作答就好，角色由主持人綜合大家的回覆分配 🎭</p>

        <div class="survey-box">
            <div id="survey"></div>
        </div>
    </main>

    <script>
    window.SURVEY = {
        script: '那一束月光',
        submitText: '送出・等月光',
        questions: [
            {"type": "radio", "title": "你想填寫哪個版本？", "label": "性別", "required": true, "options": ["女生", "男生"], "desc": "依本次劇本想體驗的角色性別選擇"},
            {"type": "info", "title": "基本資料"},
            {"type": "text", "title": "姓名／暱稱", "required": true, "placeholder": "你希望大家怎麼稱呼你？"},
            {"type": "date", "title": "遊玩日期", "required": true},
            {"type": "radio", "title": "玩過劇本殺的次數", "label": "劇本殺經驗", "required": true, "options": ["第一次", "1-3", "4-10", "11-30", "30+"]},
            {"type": "radio", "title": "現場是否有你喜歡的對象？", "label": "現場喜歡的對象", "required": true, "options": ["有的！", "沒有", "不說 🤫"]},
            {"type": "info", "title": "女生專區問題", "showIf": {"title": "你想填寫哪個版本？", "in": ["女生"]}},
            {"type": "info", "title": "男生專區問題", "showIf": {"title": "你想填寫哪個版本？", "in": ["男生"]}},
            {"type": "textarea", "tag": "Q 01", "title": "你最深刻、最難忘的一段戀情是怎樣的？", "label": "Q1 最難忘的一段戀情", "required": true, "placeholder": "可以是甜蜜的，也可以是遺憾的…"},
            {"type": "textarea", "tag": "Q 02", "title": "談過異地戀嗎？結果好嗎？為什麼？", "label": "Q2 異地戀", "required": true, "placeholder": "距離到底是考驗還是藉口？"},
            {"type": "textarea", "tag": "Q 03", "label": "Q3 信任感", "required": true, "title": "你認為一段戀愛當中信任感重不重要？\n你最不接受男生什麼行為？\n你是一個很敏感、缺乏安全感的人嗎？", "placeholder": "說說你對信任與安全感的看法…", "showIf": {"title": "你想填寫哪個版本？", "in": ["女生"]}},
            {"type": "textarea", "tag": "Q 04", "label": "Q4 愛你的還是你愛的", "required": true, "title": "你會選擇一個愛你的還是你愛的人？\n你是會主動喜歡別人並大膽表白的人嗎？\n你是付出型人格嗎？", "placeholder": "關於愛情裡的主動與被動…", "showIf": {"title": "你想填寫哪個版本？", "in": ["女生"]}},
            {"type": "textarea", "tag": "Q 03", "label": "Q3 信任感", "required": true, "title": "你認為一段戀愛當中信任感重不重要？\n如果女生很「作」，你能接受嗎？", "placeholder": "說說你對信任與包容的看法…", "showIf": {"title": "你想填寫哪個版本？", "in": ["男生"]}},
            {"type": "textarea", "tag": "Q 04", "label": "Q4 愛你的還是你愛的", "required": true, "title": "你會選擇一個愛你的人還是你愛的人？\n你會接受一個你不喜歡的女孩嗎？\n你會被感動嗎？", "placeholder": "關於選擇與被選擇…", "showIf": {"title": "你想填寫哪個版本？", "in": ["男生"]}}
        ],
        done: {
            title: '🌙 已收到你的心動信號',
            text: '角色將由主持人分配\n當天見！',
            back: { href: '../6人/那一束月光.html', text: '← 回到《那一束月光》劇本介紹' }
        }
    };
    </script>
    <script src="../survey.js?v=20261006e"></script>
    <script src="../lightbox.js?v=20261006"></script>
    <script src="../fx3d.js?v=20260714" data-fx="fireflies" data-tint="#cfe0ff" data-density="0.8"></script>
</body>
</html>
