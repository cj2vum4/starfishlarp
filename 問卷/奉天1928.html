<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>列車乘客名單 · 奉天1928</title>
    <style>
        :root {
            --veil-top: rgba(255, 255, 255, .35);
            --backdrop-opacity: .5;
            --shadow: rgba(40, 30, 20, .25);
            --error: #c0392b;
            --on-accent: #ffffff;
            --field: rgba(255, 255, 255, .7);
            --bg: #e8dfcf;
            --text: #2b2520;
            --title: #1d1915;
            --muted: #6d6255;
            --accent: #9b2c1f;
            --line: rgba(43, 37, 32, .2);
            --chip: rgba(43, 37, 32, .08);
            --card: rgba(250, 245, 235, .82);
        }
        * { box-sizing: border-box; }
        html { color-scheme: light; }
        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
            background: var(--bg);
            font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
            -webkit-font-smoothing: antialiased;
        }
        /* 海報本身當整頁的霧面背景，跟劇本主頁同一套視覺 */
        .backdrop {
            position: fixed;
            inset: -40px;
            z-index: 0;
            pointer-events: none;
            background: url("../img/劇本/奉天1928/奉天1928劇本殺封面1.webp") center / cover no-repeat;
            filter: blur(38px) saturate(1.15);
            opacity: var(--backdrop-opacity);
            transform: scale(1.1);
        }
        .backdrop::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--veil-top) 0%, var(--bg) 78%);
        }
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 16px 72px;
        }

        /* ── 主視覺 ───────────────────────────── */
        .hero {
            display: grid;
            gap: 26px;
            align-items: center;
            margin-bottom: 30px;
        }
        .poster {
            justify-self: center;
            width: min(78vw, 340px);
            margin: 0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 24px 60px var(--shadow), 0 0 0 1px var(--line);
            animation: rise .9s cubic-bezier(.2, .8, .2, 1) both;
        }
        .poster img { display: block; width: 100%; height: auto; }
        @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
        .intro { text-align: center; animation: rise .9s .12s cubic-bezier(.2, .8, .2, 1) both; }
        .eyebrow {
            display: inline-block;
            padding: 5px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: .78rem;
            letter-spacing: .35em;
            color: var(--accent);
        }
        .intro h1 {
            margin: 14px 0 4px;
            font-size: clamp(2rem, 9vw, 3rem);
            line-height: 1.15;
            letter-spacing: .12em;
            color: var(--title);
        }
        .form-title { margin: 0; font-size: 1.05rem; letter-spacing: .2em; color: var(--muted); }
        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
        }
        .chips li {
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--chip);
            font-size: .85rem;
            color: var(--text);
        }
        .lead {
            margin: 20px auto 0;
            max-width: 34em;
            line-height: 1.9;
            color: var(--text);
        }
        .lead:empty { display: none; }

        /* ── 登場角色 ─────────────────────────── */
        .cast { margin: 0 0 30px; }
        .cast h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 14px;
            font-size: .95rem;
            letter-spacing: .3em;
            color: var(--accent);
        }
        .cast h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
        .cast ul {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 92px;
            gap: 12px;
            margin: 0;
            padding: 2px 2px 10px;
            list-style: none;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
        }
        .ch { scroll-snap-align: start; text-align: center; }
        .ch img, .ch-ph {
            display: grid;
            place-items: center;
            width: 92px;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            object-position: top;
            border-radius: 10px;
            background: var(--chip);
            box-shadow: 0 0 0 1px var(--line);
            font-size: 1.6rem;
            color: var(--accent);
            cursor: zoom-in;
        }
        .ch-name { display: block; margin-top: 6px; font-size: .8rem; line-height: 1.3; color: var(--muted); }
        .note { margin: -6px 0 22px; text-align: center; font-size: .85rem; color: var(--muted); }

        @media (min-width: 860px) {
            .hero { grid-template-columns: 340px 1fr; gap: 44px; }
            .intro { text-align: left; }
            .chips { justify-content: flex-start; }
            .lead { margin-left: 0; }
            .cast ul { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); overflow: visible; }
            .ch img, .ch-ph { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) { .poster, .intro { animation: none; } }

        /* ── 問卷 ─────────────────────────────── */
        .survey-box { max-width: 680px; margin: 0 auto; }
        #survey {
            --sv-scheme: light;
            --sv-accent: var(--accent);
            --sv-on-accent: var(--on-accent);
            --sv-text: var(--text);
            --sv-muted: var(--muted);
            --sv-card: var(--card);
            --sv-border: var(--line);
            --sv-field: var(--field);
            --sv-error: var(--error);
        }

    </style>
</head>
<body>
    <div class="backdrop" aria-hidden="true"></div>

    <main class="wrap container">
        <header class="hero">
            <figure class="poster">
                <img src="../img/劇本/奉天1928/奉天1928劇本殺封面1.webp" alt="奉天1928 海報" fetchpriority="high" decoding="async">
            </figure>
            <div class="intro">
                <span class="eyebrow">角色分配問卷</span>
                <h1>奉天1928</h1>
                <p class="form-title">列車乘客名單</p>
                <ul class="chips">
                    <li>👥 3男2女</li>
                    <li>⏰ 4小時</li>
                    <li>#情感</li>
                    <li>#民國</li>
                    <li>#軍閥</li>
                </ul>
                <p class="lead">從奉天開往南京的列車即將發車<br>請乘客們確實填寫個人資訊😎</p>
            </div>
        </header>

        <section class="cast" aria-label="登場角色">
            <h2>登場角色</h2>
            <ul>
                <li class="ch"><img src="../img/劇本/奉天1928/縮圖/董制夷.webp" data-full="../img/劇本/奉天1928/董制夷.webp" alt="董制夷" loading="lazy" decoding="async"><span class="ch-name">董制夷</span></li>
                <li class="ch"><img src="../img/劇本/奉天1928/縮圖/董晴.webp" data-full="../img/劇本/奉天1928/董晴.webp" alt="董晴" loading="lazy" decoding="async"><span class="ch-name">董晴</span></li>
                <li class="ch"><img src="../img/劇本/奉天1928/縮圖/魏聞聲.webp" data-full="../img/劇本/奉天1928/魏聞聲.webp" alt="魏聞聲" loading="lazy" decoding="async"><span class="ch-name">魏聞聲</span></li>
                <li class="ch"><img src="../img/劇本/奉天1928/縮圖/馮昊.webp" data-full="../img/劇本/奉天1928/馮昊.webp" alt="馮昊" loading="lazy" decoding="async"><span class="ch-name">馮昊</span></li>
                <li class="ch"><img src="../img/劇本/奉天1928/縮圖/赫連珊.webp" data-full="../img/劇本/奉天1928/赫連珊.webp" alt="赫連珊" loading="lazy" decoding="async"><span class="ch-name">赫連珊</span></li>
            </ul>
        </section>
        <p class="note">依直覺作答就好，角色由主持人綜合大家的回覆分配 🎭</p>

        <div class="survey-box">
            <div id="survey"></div>
        </div>
    </main>

    <script>
    window.SURVEY = {
        script: '奉天1928',
        submitText: '送出・上車',
        questions: [
            {"type": "text", "title": "您在LINE裡的名字是？", "required": true},
            {"type": "radio", "title": "您的生理性別是？", "required": true, "options": ["男", "女", "男，可接受玩女角", "女，可接受玩男角"]},
            {"type": "scale", "title": "在做一個困難的決定時，您通常是依照？", "required": true, "min": 1, "max": 5, "minLabel": "現實層面的考量", "maxLabel": "心裡真實的渴望"},
            {"type": "scale", "title": "在人際關係裡，您通常是？", "required": true, "min": 1, "max": 5, "minLabel": "照顧人的", "maxLabel": "被照顧的"},
            {"type": "textarea", "title": "請依照對您來說的重要性，排列出愛情、友情、親情、自身利益四者的順序（可詳述為何如此排序）", "required": true},
            {"type": "text", "title": "如果讓您用三個形容詞來形容自己，您覺得是？", "required": true},
            {"type": "text", "title": "同行旅客有您的另一半嗎？（有任何需求可告知）"},
            {"type": "textarea", "title": "有對選角的期許、或想對車長說的話，可以在這裡補充~"}
        ],
        done: {
            title: '🎫 車票已劃位',
            text: '車長會依照你的回覆安排角色\n開車當天見！'
        }
    };
    </script>
    <script src="../survey.js?v=20261006c"></script>
    <script src="../lightbox.js?v=20261006"></script>
    <script src="../fx3d.js?v=20260714" data-fx="dust" data-tint="#8a7a62" data-density="0.7"></script>
</body>
</html>
