<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>列車乘客名單 · 奉天1928</title>
    <style>
        :root {
            --brass: #c9a227;
            --ink: #2a1a0e;
            --paper: #efe2c4;
        }
        * { box-sizing: border-box; }
        html { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
            color: #f5ecd9;
            background: #1a110a;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% -10%, rgba(201, 162, 39, .18), transparent 60%),
                linear-gradient(180deg, #1b120b 0%, #2c1810 45%, #1a110a 100%);
        }

        /* 車窗外掠過的電線桿 */
        .rails {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: repeating-linear-gradient(90deg, transparent 0 180px, rgba(0, 0, 0, .35) 180px 186px, transparent 186px 420px);
            animation: pass 2.6s linear infinite;
            opacity: .35;
        }
        @keyframes pass { to { background-position: -420px 0; } }
        @media (prefers-reduced-motion: reduce) { .rails { animation: none; } }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 640px;
            margin: 0 auto;
            padding: 32px 16px 64px;
        }

        /* 車票 */
        .ticket {
            position: relative;
            margin-bottom: 24px;
            padding: 22px 24px 20px;
            color: var(--ink);
            background:
                linear-gradient(90deg, transparent 0 calc(100% - 92px), rgba(42, 26, 14, .08) calc(100% - 92px)),
                var(--paper);
            border-radius: 10px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
            -webkit-mask: radial-gradient(circle 12px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat,
                          radial-gradient(circle 12px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
                    mask: radial-gradient(circle 12px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat,
                          radial-gradient(circle 12px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
            animation: arrive .9s cubic-bezier(.2, .8, .2, 1) both;
        }
        @keyframes arrive { from { opacity: 0; transform: translateY(-14px) rotate(-1.5deg); } }
        .ticket-top {
            display: flex;
            justify-content: space-between;
            font-size: .78rem;
            letter-spacing: .2em;
            color: #7a5a2e;
        }
        .route {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 14px 0 6px;
            font-size: clamp(1.8rem, 8vw, 2.5rem);
            font-weight: 900;
            letter-spacing: .15em;
        }
        .route .arrow { font-size: .6em; color: #9b2c1f; }
        .ticket h1 {
            margin: 0;
            text-align: center;
            font-size: 1.05rem;
            letter-spacing: .5em;
            color: #9b2c1f;
        }
        .ticket p {
            margin: 14px 0 0;
            padding-top: 12px;
            border-top: 1px dashed rgba(42, 26, 14, .35);
            text-align: center;
            line-height: 1.8;
            font-size: .95rem;
        }
        .stamp {
            position: absolute;
            right: 18px;
            bottom: 14px;
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            border: 2px solid rgba(155, 44, 31, .7);
            border-radius: 50%;
            color: rgba(155, 44, 31, .8);
            font-size: .7rem;
            line-height: 1.2;
            text-align: center;
            transform: rotate(-14deg);
        }
        @media (max-width: 480px) { .stamp { display: none; } }

        #survey {
            --sv-accent: var(--brass);
            --sv-card: rgba(28, 18, 10, .78);
            --sv-border: rgba(201, 162, 39, .3);
        }
    </style>
</head>
<body>
    <div class="rails" aria-hidden="true"></div>

    <main class="wrap">
        <header class="ticket">
            <div class="ticket-top"><span>民國十七年</span><span>頭等車廂</span></div>
            <div class="route"><span>奉天</span><span class="arrow">━━▶</span><span>南京</span></div>
            <h1>列車乘客名單</h1>
            <p>從奉天開往南京的列車即將發車<br>請乘客們確實填寫個人資訊😎</p>
            <div class="stamp" aria-hidden="true">海星<br>驗票</div>
        </header>

        <div id="survey"></div>
    </main>

    <script>
    window.SURVEY = {
        script: '奉天1928',
        submitText: '送出・上車',
        questions: [
            { type: 'text', title: '您在LINE裡的名字是？', required: true },
            { type: 'radio', title: '您的生理性別是？', required: true,
              options: ['男', '女', '男，可接受玩女角', '女，可接受玩男角'] },
            { type: 'scale', title: '在做一個困難的決定時，您通常是依照？', required: true,
              min: 1, max: 5, minLabel: '現實層面的考量', maxLabel: '心裡真實的渴望' },
            { type: 'scale', title: '在人際關係裡，您通常是？', required: true,
              min: 1, max: 5, minLabel: '照顧人的', maxLabel: '被照顧的' },
            { type: 'textarea', title: '請依照對您來說的重要性，排列出愛情、友情、親情、自身利益四者的順序（可詳述為何如此排序）', required: true },
            { type: 'text', title: '如果讓您用三個形容詞來形容自己，您覺得是？', required: true },
            { type: 'text', title: '同行旅客有您的另一半嗎？（有任何需求可告知）' },
            { type: 'textarea', title: '有對選角的期許、或想對車長說的話，可以在這裡補充~' }
        ],
        done: {
            title: '🎫 車票已劃位',
            text: '車長會依照你的回覆安排角色\n開車當天見！'
        }
    };
    </script>
    <script src="../survey.js?v=20261006"></script>
    <script src="../fx3d.js?v=20260714" data-fx="embers" data-tint="#d9a55a" data-density="0.6"></script>
</body>
</html>
