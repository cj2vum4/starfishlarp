name: Canonical Jinmen cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-jinmen-canonical.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Apply canonical Jinmen updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move detail page and audio into 7-player folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '7人'
          if [ -f '8人以上/津門遺雲.html' ]; then
            git mv '8人以上/津門遺雲.html' '7人/津門遺雲.html'
          fi
          if [ -f '8人以上/津門遺雲.mp3' ]; then
            git mv '8人以上/津門遺雲.mp3' '7人/津門遺雲.mp3'
          fi

      - name: Rewrite canonical data and page content
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          MAIN_POSTER = 'https://i.postimg.cc/QNpdd5nW/feng-mian.jpg'
          SECONDARY_POSTER = 'https://i.postimg.cc/x8yfpDz9/feng-mian2.png'
          ROLE_POSTERS = {
              '大少爺': ('🎩', 'https://i.postimg.cc/L5B9QKZk/feng-mian-she-ji-zheng-gao-(da-shao-ye).jpg'),
              '大少奶奶': ('🌷', 'https://i.postimg.cc/bYQwwbFn/feng-mian-she-ji-zheng-gao-(da-shao-nai-nai).jpg'),
              '二少爺': ('🧳', 'https://i.postimg.cc/3NC8f5DB/feng-mian-she-ji-zheng-gao-(er-shao-ye).jpg'),
              '二少奶奶': ('🪷', 'https://i.postimg.cc/NF7sCqrb/feng-mian-she-ji-zheng-gao-(er-shao-nai-nai).jpg'),
              '三小姐': ('🌸', 'https://i.postimg.cc/SR7S1Fz5/feng-mian-she-ji-zheng-gao-(san-xiao-jie).jpg'),
              '四少爺': ('🎓', 'https://i.postimg.cc/h49ttx31/feng-mian-she-ji-zheng-gao-(si-shao-ye).jpg'),
              '大掌櫃': ('🧮', 'https://i.postimg.cc/fyjzqn0C/feng-mian-she-ji-zheng-gao-(da-zhang-gui).jpg'),
          }

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_regex_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, got {count}')
              return updated

          # 1) scripts.js: make the single source of truth correct.
          scripts_path = Path('scripts.js')
          scripts = read(scripts_path)
          jinmen_line = (
              '  {"id":"jinmen","name":"津門遺雲","file":"7人/津門遺雲.html",'
              '"players":7,"playersLabel":"4男3女","time":4.5,"timeLabel":"4-5小時",'
              '"difficulty":2,"types":["民國","歡樂","嘴砲","陣營","新手"],'
              '"theme":"history","poster":"' + MAIN_POSTER + '","reviewKey":"津門遺雲",'
              '"characters":["大少爺","大少奶奶","二少爺","二少奶奶","三小姐","四少爺","大掌櫃"]},'
          )
          scripts = replace_regex_once(
              scripts,
              r'^\s*\{"id":"jinmen".*$',
              jinmen_line,
              'scripts.js Jinmen record',
              flags=re.M,
          )
          write(scripts_path, scripts)

          # 2) index.html: use the real poster and correct 7-player label directly.
          index_path = Path('index.html')
          index = read(index_path)
          new_card = '''                <a class="new-script-card" onclick="goToScript('jinmen')">
                    <img class="new-script-poster" src="https://i.postimg.cc/QNpdd5nW/feng-mian.jpg" alt="津門遺雲" loading="lazy">
                    <div class="new-script-info">
                        <div class="new-script-name">🏮 津門遺雲</div>
                        <div class="new-script-tags">
                            <span class="new-script-tag">民國</span>
                            <span class="new-script-tag">歡樂</span>
                            <span class="new-script-tag">嘴砲</span>
                            <span class="new-script-tag">4男3女</span>
                            <span class="new-script-tag">4-5小時</span>
                        </div>
                    </div>
                </a>'''
          index = replace_regex_once(
              index,
              r'\s*<a class="new-script-card" onclick="goToScript\(\'jinmen\'\)">.*?</a>',
              '\n' + new_card,
              'index new-script Jinmen card',
              flags=re.S,
          )
          index = re.sub(r'<span id="filteredCount">\d+</span>', '<span id="filteredCount">53</span>', index, count=1)
          index = re.sub(r'scripts\.js\?v=[^"\']+', 'scripts.js?v=20260727-jinmen', index)
          index = re.sub(r'\s*<script[^>]+jinmen-data-patch\.js[^>]*></script>\s*', '\n', index)
          write(index_path, index)

          # 3) Detail page: embed both main visuals and all seven confirmed role posters.
          detail_path = Path('7人/津門遺雲.html')
          if not detail_path.exists():
              raise RuntimeError('7人/津門遺雲.html was not found after move')
          detail = read(detail_path)

          meta = f'''    <meta name="description" content="津門遺雲｜7人・4男3女的民國歡樂陣營劇本。">
    <meta property="og:title" content="津門遺雲｜海星劇本殺">
    <meta property="og:description" content="民國九年，津門富商一夜暴斃，百萬遺產無主。">
    <meta property="og:image" content="{MAIN_POSTER}">\n'''
          if 'property="og:image"' not in detail:
              detail = detail.replace('    <title>津門遺雲 - 劇本殺</title>\n', meta + '    <title>津門遺雲 - 劇本殺</title>\n', 1)

          detail_css = '''
        /* --- 津門遺雲正式海報 --- */
        .poster-gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
            max-width: 920px;
            margin: 0 auto;
            align-items: start;
        }
        .poster-gallery figure { margin: 0; }
        .poster-gallery .poster-image {
            max-width: 100%;
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        .poster-caption {
            margin-top: 10px;
            color: rgba(245, 234, 208, 0.72);
            font-size: 0.9rem;
            letter-spacing: 0.08em;
        }
        .character-card {
            justify-content: flex-start;
            padding: 0 0 18px;
            min-height: 0;
        }
        .character-poster {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(212, 175, 110, 0.25);
            background: rgba(0, 0, 0, 0.25);
        }
        .character-card .character-emoji { display: none; }
        .character-card .character-name,
        .character-card .character-info {
            padding-left: 12px;
            padding-right: 12px;
        }
        @media (max-width: 680px) {
            .poster-gallery { grid-template-columns: 1fr; }
            .characters-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
'''
          if '/* --- 津門遺雲正式海報 --- */' not in detail:
              detail = detail.replace('    </style>', detail_css + '    </style>', 1)

          poster_section = f'''        <!-- 正式海報 -->
        <section class="poster-section" aria-label="津門遺雲海報">
            <div class="poster-gallery">
                <figure>
                    <img class="poster-image" src="{MAIN_POSTER}" alt="津門遺雲主海報" fetchpriority="high">
                    <figcaption class="poster-caption">津門遺雲・主海報</figcaption>
                </figure>
                <figure>
                    <img class="poster-image" src="{SECONDARY_POSTER}" alt="津門遺雲補充海報" loading="lazy">
                    <figcaption class="poster-caption">津門遺雲・補充視覺</figcaption>
                </figure>
            </div>
        </section>'''
          detail = replace_regex_once(
              detail,
              r'\s*<!-- 海報（待上傳） -->\s*<section class="poster-section">.*?</section>',
              '\n' + poster_section,
              'detail poster placeholder',
              flags=re.S,
          )
          detail = detail.replace('8人 · 4男3女＋捕快（另有 7 人版）', '7人 · 4男3女')
          detail = detail.replace('「除了捕快，這屋裡每一個人，都有嫌疑。」', '「這座靈堂裡，每一個人，都藏著不能說的秘密。」')

          capture_card = '''                    <div class="character-card">
                        <div class="character-emoji">🔍</div>
                        <div class="character-name">捕快</div>
                        <div class="character-info">男<br>奉命偵辦此案，無嫌疑、無故事（8人版）</div>
                    </div>
'''
          detail = detail.replace(capture_card, '')

          for role, (emoji, url) in ROLE_POSTERS.items():
              old = f'''                    <div class="character-card">
                        <div class="character-emoji">{emoji}</div>
                        <div class="character-name">{role}</div>'''
              new = f'''                    <div class="character-card">
                        <img class="character-poster" src="{url}" alt="津門遺雲角色海報・{role}" loading="lazy">
                        <div class="character-emoji">{emoji}</div>
                        <div class="character-name">{role}</div>'''
              if old not in detail:
                  raise RuntimeError(f'detail role card not found: {role}')
              detail = detail.replace(old, new, 1)

          detail = re.sub(r'\s*<script[^>]+jinmen-detail\.js[^>]*></script>\s*', '\n', detail)
          if '捕快' in detail:
              raise RuntimeError('detail page still contains 捕快')
          if detail.count('class="character-poster"') != 7:
              raise RuntimeError('detail page does not contain exactly seven character posters')
          write(detail_path, detail)

          # 4) Form configuration: endpoint only; roles now come from corrected scripts.js.
          config_path = Path('play-record-config.js')
          config = '''/*
 * Google Apps Script 玩本記錄寫入端點。
 * 劇本與角色資料一律由 scripts.js 的 window.SCRIPTS 提供。
 */
window.STARFISH_PLAY_RECORD_ENDPOINT =
  'https://script.google.com/macros/s/AKfycbz2jFZhU9tSm-WvZaC_lLSovG2zy3Up2-HNlK6sO6xyfnFDQu8DxRUIKmhDBg1AHMDsDg/exec';
'''
          write(config_path, config)

          form_path = Path('新增玩本記錄.html')
          form = read(form_path)
          form = re.sub(r'scripts\.js\?v=[^"\']+', 'scripts.js?v=20260727-jinmen', form)
          form = re.sub(r'play-record-config\.js\?v=[^"\']+', 'play-record-config.js?v=20260727-2', form)
          form = re.sub(r'\s*<script[^>]+jinmen-data-patch\.js[^>]*></script>\s*', '\n', form)
          write(form_path, form)

          # 5) Service worker: expire old caches and stop caching temporary patches.
          sw_path = Path('service-worker.js')
          sw = read(sw_path)
          sw = re.sub(r"const CACHE_VERSION = '[^']+';", "const CACHE_VERSION = '2026-07-27-jinmen';", sw, count=1)
          sw = re.sub(r"'\./scripts\.js\?v=[^']+'", "'./scripts.js?v=20260727-jinmen'", sw)
          sw = re.sub(r"'\./play-record-config\.js\?v=[^']+'", "'./play-record-config.js?v=20260727-2'", sw)
          sw = re.sub(r"\s*'\./jinmen-(?:detail|data-patch)\.js[^']*',?", '', sw)
          if './play-record-config.js?v=20260727-2' not in sw:
              anchor = "    './scripts.js?v=20260727-jinmen',"
              sw = sw.replace(anchor, anchor + "\n    './play-record-config.js?v=20260727-2',", 1)
          write(sw_path, sw)

          # 6) Canonical checks before commit.
          checks = {
              'scripts.js': read('scripts.js'),
              'index.html': read('index.html'),
              'play-record-config.js': read('play-record-config.js'),
              '新增玩本記錄.html': read('新增玩本記錄.html'),
              '7人/津門遺雲.html': read('7人/津門遺雲.html'),
              'service-worker.js': read('service-worker.js'),
          }
          forbidden = ['4男3女＋捕快', '8人以上/津門遺雲', 'jinmen-detail.js', 'jinmen-data-patch.js']
          for filename, text in checks.items():
              for token in forbidden:
                  if token in text:
                      raise RuntimeError(f'{filename} still contains forbidden token: {token}')
          if '捕快' in checks['scripts.js'] or '捕快' in checks['index.html'] or '捕快' in checks['7人/津門遺雲.html']:
              raise RuntimeError('a user-facing Jinmen source still contains 捕快')
          if checks['scripts.js'].count('"id":"jinmen"') != 1:
              raise RuntimeError('scripts.js must contain exactly one Jinmen record')
          for url in [MAIN_POSTER, SECONDARY_POSTER, *[v[1] for v in ROLE_POSTERS.values()]]:
              if url not in checks['7人/津門遺雲.html'] and url not in checks['scripts.js'] and url not in checks['index.html']:
                  raise RuntimeError(f'missing poster URL: {url}')
          PY

      - name: Remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f jinmen-detail.js jinmen-data-patch.js
          rm -f .github/workflows/fix-jinmen-canonical.yml

      - name: Commit canonical cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Apply canonical Jinmen updates'
          git push origin HEAD:main
