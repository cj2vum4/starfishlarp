<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#110307">
  <title>《瘋兔子》主持人控場臺</title>
  <link rel="stylesheet" href="瘋兔子-online.css">
  <script
    src="https://cdn.jsdelivr.net/npm/opencc-js@1.4.1/dist/umd/full.js"
    onerror="this.onerror=null;this.src='../vendor/opencc-js-full.js'"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="瘋兔子-mock-supabase.js"></script>
  <script src="瘋兔子-common.js" defer></script>
  <script src="瘋兔子-host.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-kicker">主持人控場臺</div>
      <h1>瘋兔子，白又白，砍下腦袋飛起來</h1>
    </div>
    <nav class="header-links" aria-label="相關頁面">
      <a class="header-link" href="瘋兔子白又白砍下腦袋飛起來.html">劇本介紹</a>
      <a class="header-link" href="瘋兔子_主持手冊.html" target="_blank">主持手冊</a>
      <a class="header-link" href="../疯兔子搜尋.html" target="_blank">原線索工具</a>
    </nav>
  </header>

  <main class="app-shell">
    <div id="globalNotice" class="notice hidden" role="status"></div>

    <section class="grid dashboard-grid">
      <div class="grid">
        <article class="card">
          <div class="card-body">
            <div class="section-heading">
              <div>
                <h2>場次連線</h2>
                <p id="sessionStatus">建立或加入場次後即可開始控場</p>
              </div>
            </div>
            <div class="field">
              <label for="sessionInput">場次程式碼</label>
              <input
                id="sessionInput"
                class="input"
                maxlength="13"
                placeholder="留白可建立隨機 RT- 程式碼"
                autocomplete="off">
            </div>
            <div class="session-actions" style="margin-top: .8rem">
              <button id="createSessionButton" class="button primary" type="button">建立場次</button>
              <button id="joinSessionButton" class="button" type="button">加入既有場次</button>
            </div>
            <div id="sessionControls" class="session-meta hidden" style="margin-top: 1rem">
              <div id="sessionCode" class="session-code">尚未建立</div>
              <div class="session-actions">
                <button id="copySessionButton" class="button small" type="button">複製程式碼</button>
                <button id="endSessionButton" class="button small danger" type="button">結束場次</button>
              </div>
              <div class="field">
                <label>玩家端連結</label>
                <a id="playerLink" class="muted" target="_blank" rel="noopener">尚未建立玩家端連結</a>
              </div>
              <button id="copyPlayerLinkButton" class="button small" type="button">複製玩家端連結</button>
            </div>
          </div>
        </article>

        <article class="card">
          <div class="card-body">
            <div class="section-heading">
              <div>
                <h2>遊戲流程控制</h2>
                <p>切換後玩家端會即時顯示目前階段</p>
              </div>
            </div>
            <div id="phaseList" class="phase-list"></div>
          </div>
        </article>

        <article class="card">
          <div class="card-body">
            <div class="section-heading">
              <div>
                <h2>六名角色連線狀態</h2>
                <p id="playerCount">0 / 6 名玩家在線</p>
              </div>
            </div>
            <div id="playerGrid" class="role-grid"></div>
          </div>
        </article>
      </div>

      <aside class="card">
        <div class="card-body">
          <div class="section-heading">
            <div>
              <h2>主持人廣播</h2>
              <p>廣播內容一律以純文字顯示</p>
            </div>
          </div>
          <div class="field">
            <label for="broadcastInput">廣播內容</label>
            <textarea
              id="broadcastInput"
              class="textarea"
              maxlength="1000"
              placeholder="輸入要傳給所有玩家的訊息"></textarea>
          </div>
          <div id="broadcastTemplates" class="button-row" style="margin-top: .7rem">
            <button class="button small" type="button" data-message="請停止討論，注意主持人說明。">停止討論</button>
            <button class="button small" type="button" data-message="剩餘五分鐘，請整理目前推理。">剩餘五分鐘</button>
            <button class="button small" type="button" data-message="請各位依序發表最終推理。">最終推理</button>
          </div>
          <button id="broadcastButton" class="button primary" type="button" style="width: 100%; margin-top: .8rem">
            發送廣播
          </button>

          <div class="section-heading" style="margin-top: 1.5rem">
            <h3>廣播歷史</h3>
          </div>
          <div id="broadcastHistory" class="history-list"></div>
        </div>
      </aside>
    </section>

    <section class="card" style="margin-top: 1rem">
      <div class="card-body">
        <div class="section-heading">
          <div>
            <h2>線索搜尋與發放</h2>
            <p id="clueStatus">正在分頁載入線索…</p>
          </div>
        </div>
        <div class="filter-row">
          <div class="field" style="flex: 2 1 18rem">
            <label for="clueSearch">檔名與線索全文搜尋</label>
            <input id="clueSearch" class="input" type="search" placeholder="輸入關鍵字">
          </div>
          <div class="field" style="flex: 1 1 13rem">
            <label for="folderFilter">線索類別</label>
            <select id="folderFilter" class="select">
              <option value="">所有線索類別</option>
            </select>
          </div>
        </div>
        <div id="clueList" class="clue-list" style="margin-top: 1rem"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
